# The shared quality bar, read by `go tool lateregate`. The gates live in
# latere.ai/x/ci-gate, pinned in go.mod; only repository-specific values are
# here.

cover:
  trim_prefix: latere.ai/x/topos/
  exempt:
    internal/store/postgres: >-
      measured by the postgres tier (go test -tags postgres), which runs the
      store conformance suite against a real Postgres from DATABASE_URL or a
      container it starts; the hermetic suite has neither.
    cmd/topos: >-
      main hands the process's streams, environment and working directory to
      internal/toposcli, where the command and its tests live; the wiring is
      five statements and main itself is not measurable in process.
    session/storetest: >-
      the conformance suite of session.Store; its statements are assertions,
      and the uncovered ones are the failure branches a conforming store
      never takes. The stores it runs against carry the floor.

spec:
  vocabulary:
    track: [core]
    effort: [small, medium, large, xlarge]
  archive:
    dir: .archive
    statuses: [complete, superseded]
  status:
    - vague
    - drafted
    - validated
    - dispatched
    - in-progress
    - testing
    - complete
    - stale
    - superseded
  require: [title, status, track, depends_on, affects, effort, created, updated, author]
  wikilinks: true
  numbered: true
  started: [dispatched, in-progress, testing, complete]
  settled: [complete, superseded]
  exclude: [README.md]
  tables: true
  require_section:
    - Overview
    - Current state
    - Design
    - Not in this spec
    - Acceptance criteria
  require_section_by_status:
    complete: [Outcome]

# The suite runs with the Go toolchain and /usr/bin on PATH. The host
# machine runs commands with /bin/sh by its absolute path; /usr/bin is for
# git, which the checkpoints of spec 034 run on the machine, found there
# on the runners and on macOS alike.
hermetic:
  allow: [/usr/bin]

tempdir:
  allow: {}

# Spec 001's dependency rule: the build list of every role reaches the
# standard library and latere.ai/x/pkg on day one, and each later
# dependency is a row with its decision.
depcheck:
  packages:
    latere.ai/x/topos/cmd/toposd:
      decision: >-
        the server reaches latere.ai/x/pkg and the standard library, and
        the OpenTelemetry SDK behind pkg/otel, which the shared verifier of
        spec 006 instruments its key-set reads with and the family's
        otel-client gate requires for every outbound call (spec 001 admits
        the SDK in both binaries); the Postgres driver joins with spec 014,
        the Cella client with spec 009, and nothing else does without a row
        here
      allow:
        latere.ai/x/pkg: the shared library every Latere service is built on (spec 002)
        go.opentelemetry.io: the OpenTelemetry API, SDK and OTLP exporters pkg/otel builds on
        google.golang.org/protobuf: the wire encoding of the OTLP exporters
        google.golang.org/grpc: reached by the OTLP trace exporter's shared types
        google.golang.org/genproto: the status types grpc carries
        github.com/grpc-ecosystem/grpc-gateway: reached by the OTLP HTTP exporters' error mapping
        golang.org/x/net: HTTP/2 and trace support of grpc
        golang.org/x/sys: the platform calls of grpc and the SDK
        golang.org/x/text: text normalization of golang.org/x/net
        golang.org/x/time: the rate limiter of pkg/otel's log proxy
        github.com/cenkalti/backoff: the OTLP exporters' retry backoff
        github.com/cespare/xxhash: attribute hashing in the metric SDK
        github.com/felixge/httpsnoop: response capture in otelhttp
        github.com/go-logr: the SDK's internal logger
        github.com/google/uuid: the SDK's instance ids
    latere.ai/x/topos/cmd/topos:
      decision: >-
        the scripting and test client runs local sessions in process, so it
        reaches what the harness reaches: latere.ai/x/pkg for the llmdialect
        codecs and retry, and the instrumented HTTP client of pkg/otel that
        the family's otel-client gate requires for every outbound call, with
        the OpenTelemetry SDK and its OTLP exporters behind it (spec 001
        admits the SDK in both binaries)
      allow:
        latere.ai/x/pkg: the shared library every Latere service is built on (spec 002)
        go.opentelemetry.io: the OpenTelemetry API, SDK and OTLP exporters pkg/otel builds on
        google.golang.org/protobuf: the wire encoding of the OTLP exporters
        google.golang.org/grpc: reached by the OTLP trace exporter's shared types
        google.golang.org/genproto: the status types grpc carries
        github.com/grpc-ecosystem/grpc-gateway: reached by the OTLP HTTP exporters' error mapping
        golang.org/x/net: HTTP/2 and trace support of grpc
        golang.org/x/sys: the platform calls of grpc and the SDK
        golang.org/x/text: text normalization of golang.org/x/net
        golang.org/x/time: the rate limiter of pkg/otel's log proxy
        github.com/cenkalti/backoff: the OTLP exporters' retry backoff
        github.com/cespare/xxhash: attribute hashing in the metric SDK
        github.com/felixge/httpsnoop: response capture in otelhttp
        github.com/go-logr: the SDK's internal logger
        github.com/google/uuid: the SDK's instance ids
        github.com/goccy/go-yaml: the YAML decoder of scripted-model scripts and, with spec 003, manifests

license:
  spdx: Apache-2.0
  holder: Latere AI

# The identity shape of the family. Topos is a core: it verifies a caller's
# token and asks one authorizer, and decides nothing about a person (spec
# 006). The v0.7.0 record under docs/history names hosts of that time and is
# a record the rules assert nothing about.
identity:
  role: core
  audience: topos
  config_prefix: TOPOS
  api_group: topos.latere.ai
  reached_by: self-hosted
  roles_only: true
  skip: [docs/history]
  # A manifest's permission is a grant of the agent's key, {action,
  # resource} in the grammar of specs 003 and 018, and not the
  # authorizer's question, which toposd asks through latere.ai/x/pkg/authz.
  envelope_exempt: [manifest/v1/permission.go]

# Serving queries read the pooled URL when it is set; the migrations and
# LISTEN keep the direct one (spec 014).
postgres:
  role: pooled
  direct_env: TOPOS_DB_URL
  pool_env: TOPOS_DB_POOL_URL
