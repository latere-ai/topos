# The shared quality bar, read by `go tool lateregate`. The gates live in
# latere.ai/x/ci-gate, pinned in go.mod; only repository-specific values are
# here.

cover:
  trim_prefix: latere.ai/x/topos/
  exempt:
    session/storetest: >-
      the conformance suite of session.Store; its statements are assertions,
      and the uncovered ones are the failure branches a conforming store
      never takes. The stores it runs against carry the floor.

spec:
  archive:
    dir: .archive
    statuses: [complete, superseded]
  status:
    - vague
    - drafted
    - validated
    - dispatched
    - in-progress
    - testing
    - complete
    - stale
    - superseded
  require: [title, status, track, depends_on, affects, effort, created, updated, author]
  wikilinks: true
  numbered: true
  started: [dispatched, in-progress, testing, complete]
  settled: [complete, superseded]
  exclude: [README.md]
  tables: true
  require_section:
    - Overview
    - Current state
    - Design
    - Not in this spec
    - Acceptance criteria
  require_section_by_status:
    complete: [Outcome]

# The suite runs with only the Go toolchain on PATH. The host machine of
# spec 009 runs sh for the bash tool and adds /bin when its tests land.
hermetic:
  allow: []

tempdir:
  allow: {}

# Spec 001's dependency rule: the build list of every role reaches the
# standard library and latere.ai/x/pkg on day one, and each later
# dependency is a row with its decision.
depcheck:
  packages:
    latere.ai/x/topos/cmd/toposd:
      decision: >-
        the server reaches latere.ai/x/pkg and the standard library; the
        Postgres driver joins with spec 014, the Cella client with spec 009,
        the OpenTelemetry SDK with spec 023, and nothing else does without a
        row here (spec 001)
      allow:
        latere.ai/x/pkg: the shared library every Latere service is built on (spec 002)
    latere.ai/x/topos/cmd/topos:
      decision: >-
        the core's scripting and test client reaches the standard library
        alone on day one; the harness packages of this module and
        latere.ai/x/pkg join with spec 024, each as a row here
      allow: {}

license:
  spdx: Apache-2.0
  holder: Latere AI

# The identity shape of the family. Topos is a core: it verifies a caller's
# token and asks one authorizer, and decides nothing about a person (spec
# 006). The v0.7.0 record under docs/history names hosts of that time and is
# a record the rules assert nothing about.
identity:
  role: core
  audience: topos
  config_prefix: TOPOS
  api_group: topos.latere.ai
  reached_by: self-hosted
  roles_only: true
  skip: [docs/history]
  # Nothing is served under /v1 and nothing is decided before spec 006
  # mounts the shared verifier and asks through the shared authorizer
  # client. The waivers end with that spec, in phase 2.
  waive:
    verifier:
      reason: >-
        spec 006 mounts latere.ai/x/pkg/authkit/jwt on /v1; toposd serves
        only its probes until then, so no token is verified by anything
      until: 2026-12-31
    authorizer:
      reason: >-
        spec 006 asks through latere.ai/x/pkg/authz; toposd decides nothing
        until then, because it serves no action to decide
      until: 2026-12-31
