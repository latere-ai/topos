      summary: Fire a trigger
      description: "An event trigger takes one envelope {id, product, verb, resource, actor, subject, time, payload}: id is the producer's id of the delivery, at most 200 characters, unique per product, product lowercase, time RFC 3339, payload an object. A schedule trigger takes an empty body and fires now; send an Idempotency-Key to fire it once. The answer is the firing {id, trigger_id, origin, event, key, outcome, reason, session_id, received_at}, where outcome is started, continued, held, filtered, skipped_active, skipped_busy, skipped_late, refused or failed. A redelivery of an event answers its first firing and starts nothing; a failed firing answers 503 and a redelivery runs it again. An event outside spec.on is filtered, counted and stored nowhere. A suspended trigger answers conflict. The firing's session.create and session.send are asked as the trigger's owner."
      x-topos-actions:
        - trigger.fire
        - session.create
        - session.send
      parameters:
        - name: ref
          in: path
          required: true
          description: An id, which names its object whoever owns it, subject to the authorizer, or a name, read among the agents of the caller's context or the caller's own triggers. A name only another owner holds answers not_found, as one nobody holds does.
          schema:
            type: string
      requestBody:
        content:
          application/json:
            example:
              id: 123e4567-e89b-12d3-a456-426614174000
              product: github
              verb: release.published
              resource: example/widgets@v1.4.0
              actor: ann
              time: "2026-09-22T12:40:00Z"
              payload:
                tag: v1.4.0
      responses:
        "200":
          description: OK
          content:
            application/json:
              example:
                id: frg_01M34J2N80QKPCFHVXPHHQRHGQ
                trigger_id: trg_01M34HGBA0JR98WKKXWZGAX6VA
                origin: event
                event:
                  product: github
                  verb: release.published
                  resource: example/widgets@v1.4.0
                  id: 123e4567-e89b-12d3-a456-426614174000
                key: example/widgets@v1.4.0
                outcome: started
                session_id: ses_01M34J2N81KBW8FS0WCBFSJCGZ
                received_at: "2026-09-22T12:40:00Z"
        default:
          $ref: "#/components/responses/Error"
  /triggers/{ref}/firings:
    get:
      operationId: listFirings
