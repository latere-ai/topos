    patch:
      operationId: updateSession
      summary: Change a session
      description: "The body is {\"model\": {\"name\": \"<model>\", \"reasoning\": \"<level>\"}, \"policy\": {\"mode\": \"<mode>\"}, \"title\": \"<title>\", \"metadata\": {\"<key>\": \"<value>\"}}: the model the session's next turn runs and its reasoning level, either member or both, the approval mode its next steps decide calls under, one of plan, confirm, progressive, the session's title, and its metadata. The body names model, policy, title, metadata or more than one; any other member is refused. A member left out keeps what the session runs. reasoning is one of minimal, low, medium, high, or empty to return to the agent's own; it holds across a change of the model, and a model that does not reason ignores it. The level may still be named \"effort\", its name before reasoning, which is read through every v0.x release and dropped in v1.0; a body that names both with different levels is invalid_request. The agent's own model's name is the agent's spec.model as it names it, and any other name is that model through the installation's model connection. The authorizer is asked session.update with session_id, model when the body names one, and the level the next turn runs at when the body names one, under both effort and reasoning, and a deny is forbidden. Its allow may name the model to run in place of the one the body names: the session then runs that model, and its model's via is the name the body asked, which a client that offers the choice shows; via is absent when the session runs the name asked. Its allow may also name the level the change runs at, empty for the agent's own, in place of the one the body names. The model that runs is checked after the authorizer is asked: one no source gives an input window and an output limit is model_unknown, and a gateway that does not answer model_unavailable. An allowed change appends session.model_changed {by, old, new}, each {name, via, reasoning}, and answers the Session, whose model is the new one; a change to the model and the level the session runs appends nothing. A turn already running keeps its model and its level: the change takes effect at the next turn. A change of the mode asks the same session.update with approval_mode, current_approval_mode, the mode the session runs, and agent_approval_mode, the mode its agent names and the session started in. It appends session.policy_changed {by, old, new}, each {mode}, in the same batch as a change of the model, and the Session's policy.mode is the new one; its lists and thresholds do not change. The mode holds from the next step, in the turn that runs: a call decided before keeps its verdict, and a call waiting for a confirmation keeps waiting for the person's answer whichever way the mode moved. A thread runs no looser than the modes its own agents name, and a host with no operating-system sandbox decides progressive as confirm. A title is trimmed of surrounding white space, and one that is then empty, longer than 200 characters, or holds a control character or a line or paragraph separator is invalid_request. A change of the title asks the same session.update with title, the trimmed title, and appends session.title_changed {by, old, new}, the title the session had, empty when it had none, and the one it has, after the other changes of the same body; the Session's title is the new one and its updated_at does not move. A change to the title the session has appends nothing. metadata is a merge: a string sets its key, null deletes it, and a key the body does not name is kept; {} is invalid_request, and the metadata after the merge is held to the rules of a create's. A change of the metadata asks the same session.update with metadata, the change as sent, null included, and current_metadata, the value each key it names holds now, a key the session does not hold left out. It appends no event: the store writes the metadata, the Session's metadata is the merged one, and a change to what the session holds writes nothing. A body that names metadata alone is taken on an idle, a running and an ended session alike; beside model, policy or title it follows their rule, so on an ended session it is conflict and changes nothing. An allowed change that changes the metadata is reported to the installation's sink as session.update with the keys it changed and none of their values."
      x-topos-actions:
        - session.update
        - session.read
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            example:
              model:
                name: claude-sonnet-4-5
                reasoning: high
              policy:
                mode: progressive
      responses:
        "200":
          description: OK
          content:
            application/json:
              example:
                schema: 1
                id: ses_01M34G2JF01B91B8399CD1G6YP
                agent:
