  /agents/{ref}:
    get:
      operationId: getAgent
      summary: Read an agent
      description: Get an agent's latest version by id, or by name among the agents of the caller's context. Every model of the spec, spec.model, spec.advisor.model and each inline subagent's, answers its reasoning level as reasoning. A version is stored, and its digest computed, with the level under effort, its name before reasoning, so the spec answered is not byte for byte the spec its digest covers.
      x-topos-actions:
        - agent.read
      parameters:
        - name: ref
          in: path
          required: true
          description: An id, which names its object whoever owns it, subject to the authorizer, or a name, read among the agents of the caller's context or the caller's own triggers. A name only another owner holds answers not_found, as one nobody holds does.
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              example:
                apiVersion: topos.latere.ai/v1
                kind: Agent
                metadata:
                  name: release-notes
                  displayName: Release notes
                spec:
