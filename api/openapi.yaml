openapi: 3.1.0
info:
  title: Topos API
  version: v1
  description: Agents, their versions, the sessions people have with them, and the triggers that start and continue sessions on a schedule or on delivered events. Every route is verified and asked of the installation's authorizer; every error is one envelope with a code of the table under components.schemas.Error.
servers:
  - url: /v1
security:
  - bearer: []
paths:
  /agents/{name}:
    put:
      operationId: applyAgent
      summary: Apply an Agent manifest to the caller's own agent of the name; a changed spec creates a version
      description: "The body is one Agent manifest of topos.latere.ai/v1. metadata.name is the agent's identifier, a DNS label equal to the path's name. metadata.displayName, optional, is the name a person reads: text on one line of at most 200 characters, without control characters, line breaks or bidirectional controls; an agent without one is shown by its name. A changed spec creates the next version. A change to the metadata alone (the display name, labels, annotations) creates none: it replaces the latest version's metadata, and every later read returns it."
      x-topos-actions:
        - agent.create
        - agent.update
        - agent.read
      parameters:
        - name: name
          in: path
          required: true
          description: The name, unique within its owner, the subject that applied it. An apply acts on the caller's own object of the name and creates it when the caller holds none; an object of the name another subject holds is neither read nor changed.
          schema:
            type: string
      requestBody:
        content:
          application/json: {}
          application/yaml: {}
      responses:
        "200":
          description: OK
        default:
          $ref: "#/components/responses/Error"
  /agents:
    get:
      operationId: listAgents
      summary: List agents
      x-topos-actions:
        - agent.list
      responses:
        "200":
          description: OK
        default:
          $ref: "#/components/responses/Error"
  /agents/{ref}:
    get:
      operationId: getAgent
      summary: Get an agent's latest version by id, or by name among the caller's own agents
      x-topos-actions:
        - agent.read
      parameters:
        - name: ref
          in: path
          required: true
          description: An id, which names its object whoever owns it, subject to the authorizer, or a name, read among the caller's own objects. A name only another subject holds answers not_found, as one nobody holds does.
          schema:
            type: string
      responses:
        "200":
          description: OK
        default:
          $ref: "#/components/responses/Error"
  /agents/{ref}/versions:
    get:
      operationId: listAgentVersions
      summary: List an agent's versions
      x-topos-actions:
        - agent.read
      parameters:
        - name: ref
          in: path
          required: true
          description: An id, which names its object whoever owns it, subject to the authorizer, or a name, read among the caller's own objects. A name only another subject holds answers not_found, as one nobody holds does.
          schema:
            type: string
      responses:
        "200":
          description: OK
        default:
          $ref: "#/components/responses/Error"
  /agents/{ref}/versions/{n}:
    get:
      operationId: getAgentVersion
      summary: Get one version of an agent
      x-topos-actions:
        - agent.read
      parameters:
        - name: ref
          in: path
          required: true
          description: An id, which names its object whoever owns it, subject to the authorizer, or a name, read among the caller's own objects. A name only another subject holds answers not_found, as one nobody holds does.
          schema:
            type: string
        - name: "n"
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
        default:
          $ref: "#/components/responses/Error"
  /agents/{ref}/archive:
    post:
      operationId: archiveAgent
      summary: Archive an agent; running sessions keep their version
      x-topos-actions:
        - agent.archive
      parameters:
        - name: ref
          in: path
          required: true
          description: An id, which names its object whoever owns it, subject to the authorizer, or a name, read among the caller's own objects. A name only another subject holds answers not_found, as one nobody holds does.
          schema:
            type: string
      requestBody:
        content:
          application/json: {}
      responses:
        "200":
          description: OK
        default:
          $ref: "#/components/responses/Error"
  /sessions:
    post:
      operationId: createSession
      summary: Create a session of an agent, named by id or by name among the caller's own agents
      x-topos-actions:
        - session.create
      requestBody:
        content:
          application/json: {}
      responses:
        "201":
          description: Created
        default:
          $ref: "#/components/responses/Error"
    get:
      operationId: listSessions
      summary: List sessions, filtered by agent, status, runner and archived
      x-topos-actions:
        - session.list
      parameters:
        - name: agent
          in: query
          description: An agent's id, or a name among the caller's own agents.
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
            enum:
              - idle
              - running
              - ended
        - name: runner
          in: query
          schema:
            type: string
            enum:
              - hosted
              - external
        - name: archived
          in: query
          description: false or absent leaves archived sessions out, true lists only them, any lists both.
          schema:
            type: string
            enum:
              - "false"
              - "true"
              - any
      responses:
        "200":
          description: OK
        default:
          $ref: "#/components/responses/Error"
  /sessions/{id}:
    get:
      operationId: getSession
      summary: Get a session
      x-topos-actions:
        - session.read
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
        default:
          $ref: "#/components/responses/Error"
    patch:
      operationId: updateSession
      summary: Change the model the session's next turn runs, or its reasoning effort
      description: "The body is {\"model\": {\"name\": \"<model>\", \"effort\": \"<effort>\"}}, the model the session's next turn runs and its reasoning effort, either member or both; any other member is refused. A member left out keeps what the session runs. effort is one of minimal, low, medium, high, or empty to return to the agent's own; it holds across a change of the model, and a model that takes no reasoning effort ignores it. The agent's own model's name is the agent's spec.model as it names it, and any other name is that model through the installation's model connection. A model no source gives an input window and an output limit is model_unknown, and a gateway that does not answer model_unavailable; the authorizer is asked session.update with session_id, model when the body names one, after the model resolved, and effort, the effort the next turn runs at, when the body names one, and a deny is forbidden. An allowed change appends session.model_changed {by, old, new}, each {name, effort}, and answers the Session, whose model is the new one; a change to the model and the effort the session runs appends nothing. A turn already running keeps its model and its effort: the change takes effect at the next turn."
      x-topos-actions:
        - session.update
        - session.read
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json: {}
      responses:
        "200":
          description: OK
        default:
          $ref: "#/components/responses/Error"
    delete:
      operationId: deleteSession
      summary: Delete a session, its log and its blobs
      x-topos-actions:
        - session.delete
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: No Content
        default:
          $ref: "#/components/responses/Error"
  /sessions/{id}/end:
    post:
      operationId: endSession
      summary: End an idle session completed or canceled
      x-topos-actions:
        - session.end
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json: {}
      responses:
        "200":
          description: OK
        default:
          $ref: "#/components/responses/Error"
  /sessions/{id}/fork:
    post:
      operationId: forkSession
      summary: Start a new session from a session's log at a turn boundary, an ended or expired session included
      description: "The body is {\"at_seq\": N}, or empty. at_seq is the sequence of a session.status idle of the session's own thread, the end of a turn; absent, the last one, which for an ended or expired session is the one before its end. Another sequence, or a session that never finished a turn, is invalid_fork_point. The answer is the new Session, 201: a new id, parent {session_id, seq}, the same agent version, repositories and capture, the forked session's title marked as its continuation (\"Notes\" gives \"Notes (continued)\", which gives \"Notes (continued 2)\"; no title gives none), status idle with the stop reason at the fork point, a lifetime and a budget of its own from now, and the caller as initiator. Its log starts as a copy of events 1 to seq, ids included, with every blob they name, so its first turn has the forked session's history; its spend starts at what the copied model requests cost. The fork point's checkpoint is restored into its working directory when its first machine opens and the runner can reach it, recorded as session.machine reason restored. The route asks session.read, so a caller who may not read the session hears not_found, then session.fork with the fields of a create for the new session and owner, parent and seq of the forked one. A session of an archived agent is conflict."
      x-topos-actions:
        - session.read
        - session.fork
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json: {}
      responses:
        "201":
          description: Created
        default:
          $ref: "#/components/responses/Error"
  /sessions/{id}/archive:
    post:
      operationId: archiveSession
      summary: Archive an ended session, leaving it out of the lists
      description: "The body is empty. An ended session gets archived_at and leaves the lists unless they ask for archived sessions; it stays readable, streamable and forkable by id, and nothing is appended to its log. An idle or running session is conflict: end it first. Archiving an archived session keeps its archived_at. The route asks session.read, then session.update with session_id and archived true; a deny is forbidden."
      x-topos-actions:
        - session.read
        - session.update
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json: {}
      responses:
        "200":
          description: OK
        default:
          $ref: "#/components/responses/Error"
  /sessions/{id}/unarchive:
    post:
      operationId: unarchiveSession
      summary: Unarchive a session, returning it to the lists
      description: The body is empty. The session's archived_at is cleared and it returns to the lists; a session that is not archived is answered as it is. The route asks session.read, then session.update with session_id and archived false; a deny is forbidden.
      x-topos-actions:
        - session.read
        - session.update
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json: {}
      responses:
        "200":
          description: OK
        default:
          $ref: "#/components/responses/Error"
  /sessions/{id}/resume:
    post:
      operationId: resumeSession
      summary: Resume a session idle on its budget once the cap is raised
      x-topos-actions:
        - session.resume
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json: {}
      responses:
        "200":
          description: OK
        default:
          $ref: "#/components/responses/Error"
  /sessions/{id}/events:
    get:
      operationId: listEvents
      summary: List a session's events from a sequence
      x-topos-actions:
        - session.read
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: sendEvent
      summary: Send one user event
      description: "The body is one user event, {\"type\", \"payload\"}: user.message, user.interrupt, user.tool_confirmation or user.tool_result. A user.message's payload holds content, text blocks {\"type\":\"text\",\"text\"} and inline images {\"type\":\"image\",\"image\":{\"media_type\",\"data\"}} (PNG, JPEG, GIF or WebP, base64, at most 8 of at most 5242880 bytes each), and attachments, files {\"name\",\"media_type\",\"data\"} (base64, at most 8 of at most 5242880 bytes each, the name one path segment of at most 255 bytes). The server stores each file as a blob of the session and records it as {name, media_type, size, blob, path}, path attachments/<event id>/<name>, in a directory of the message's own, and no two files of one message share a name; the runner writes it at that path in the working directory when the session's machine opens, or before the next step when it is open, and the model reads the paths in the message. An image reaches a model whose figures say it takes images, and is a note that it cannot see it otherwise. An image or a file past its limit is attachment_too_large; the body is at most 8388608 bytes."
      x-topos-actions:
        - session.send
        - session.interrupt
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json: {}
      responses:
        "200":
          description: OK
        default:
          $ref: "#/components/responses/Error"
  /sessions/{id}/stream:
    get:
      operationId: streamEvents
      summary: Stream a session's events as Server-Sent Events
      description: "Server-Sent Events: every event of the log from from_seq, or after the sequence a Last-Event-ID header names, then each new one as it is appended, from any replica, each a frame of id: <seq>, event: <type> and data: <the event's JSON>. A comment line is sent every 15 seconds, and the stream closes after the event that ends the session. With deltas=1 the stream also carries the session's live output while a response arrives, best effort: frames of event: delta whose data is a Delta, with no id, so a reconnect with the browser's last event id resumes the log where it was. A delta is never appended and never replayed. A subject holds at most 16 streams open at once on one replica; the next is rate_limited."
      x-topos-actions:
        - session.read
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: from_seq
          in: query
          description: The sequence the replay starts at; 1 when absent. A Last-Event-ID header starts it after the sequence the header names instead.
          schema:
            type: integer
            minimum: 1
        - name: deltas
          in: query
          description: "1 also carries the session's live deltas, each an event: delta frame with no id; 0 or absent carries the log's events alone."
          schema:
            type: string
            enum:
              - "0"
              - "1"
      responses:
        "200":
          description: OK
          content:
            text/event-stream:
              schema:
                type: string
                description: "Frames of `id: <seq>`, `event: <type>` and `data: <the event's JSON>`, a `: keepalive` comment line between them, and with deltas=1 frames of `event: delta` and `data: <a Delta>` with no id."
        default:
          $ref: "#/components/responses/Error"
  /sessions/{id}/blobs/{digest}:
    get:
      operationId: getBlob
      summary: Get a blob of a session
      x-topos-actions:
        - session.read
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: digest
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
        default:
          $ref: "#/components/responses/Error"
  /sessions/{id}/events/{event_id}/redact:
    post:
      operationId: redactEvent
      summary: Replace one event's content with a tombstone
      x-topos-actions:
        - session.redact
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: event_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json: {}
      responses:
        "204":
          description: No Content
        default:
          $ref: "#/components/responses/Error"
  /triggers/{name}:
    put:
      operationId: applyTrigger
      summary: Apply a Trigger manifest to the caller's own trigger of the name; the caller becomes its owner
      description: "The body is one Trigger manifest of topos.latere.ai/v1. It fires on spec.schedule, a five-field cron expression or @hourly, @daily, @weekly read in spec.timeZone, or on the events spec.on selects: product exactly, verbs and resources each exact or a prefix ending in *, and match rules {path, in} on the payload. spec.session.message, title and key, and a repository's url and ref, are templates of {{event.*}}, {{trigger.id}}, {{trigger.name}}, {{firing.id}} and {{firing.time}}; each value is cut at 16384 bytes and a message past 65536 bytes refuses its firing. spec.session.policy new starts a session per firing, skipped while the key's session is active under skipIfActive; continue sends each firing to the key's open session, held while it waits for a person. At most spec.maxActive sessions, 5 by default and 100 at most, are active at once. The caller becomes the trigger's owner, the initiator of every session it starts, and a firing is asked of the authorizer as the owner in the context the caller's token names."
      x-topos-actions:
        - trigger.create
        - trigger.update
        - agent.read
      parameters:
        - name: name
          in: path
          required: true
          description: The name, unique within its owner, the subject that applied it. An apply acts on the caller's own object of the name and creates it when the caller holds none; an object of the name another subject holds is neither read nor changed.
          schema:
            type: string
      requestBody:
        content:
          application/json: {}
          application/yaml: {}
      responses:
        "200":
          description: OK
        default:
          $ref: "#/components/responses/Error"
  /triggers:
    get:
      operationId: listTriggers
      summary: List triggers
      x-topos-actions:
        - trigger.list
      responses:
        "200":
          description: OK
        default:
          $ref: "#/components/responses/Error"
  /triggers/{ref}:
    get:
      operationId: getTrigger
      summary: Get a trigger by id, or by name among the caller's own triggers, with its firing record
      x-topos-actions:
        - trigger.read
      parameters:
        - name: ref
          in: path
          required: true
          description: An id, which names its object whoever owns it, subject to the authorizer, or a name, read among the caller's own objects. A name only another subject holds answers not_found, as one nobody holds does.
          schema:
            type: string
      responses:
        "200":
          description: OK
        default:
          $ref: "#/components/responses/Error"
    delete:
      operationId: deleteTrigger
      summary: Delete a trigger with its firings; the sessions it started keep running
      x-topos-actions:
        - trigger.delete
      parameters:
        - name: ref
          in: path
          required: true
          description: An id, which names its object whoever owns it, subject to the authorizer, or a name, read among the caller's own objects. A name only another subject holds answers not_found, as one nobody holds does.
          schema:
            type: string
      responses:
        "204":
          description: No Content
        default:
          $ref: "#/components/responses/Error"
  /triggers/{ref}/fire:
    post:
      operationId: fireTrigger
      summary: Deliver one event to an event trigger, or fire a schedule trigger now; answers the firing
      description: "An event trigger takes one envelope {id, product, verb, resource, actor, subject, time, payload}: id is the producer's id of the delivery, at most 200 characters, unique per product, product lowercase, time RFC 3339, payload an object. A schedule trigger takes an empty body and fires now; send an Idempotency-Key to fire it once. The answer is the firing {id, trigger_id, origin, event, key, outcome, reason, session_id, received_at}, where outcome is started, continued, held, filtered, skipped_active, skipped_busy, skipped_late, refused or failed. A redelivery of an event answers its first firing and starts nothing; a failed firing answers 503 and a redelivery runs it again. An event outside spec.on is filtered, counted and stored nowhere. A suspended trigger answers conflict. The firing's session.create and session.send are asked as the trigger's owner."
      x-topos-actions:
        - trigger.fire
        - session.create
        - session.send
      parameters:
        - name: ref
          in: path
          required: true
          description: An id, which names its object whoever owns it, subject to the authorizer, or a name, read among the caller's own objects. A name only another subject holds answers not_found, as one nobody holds does.
          schema:
            type: string
      requestBody:
        content:
          application/json: {}
      responses:
        "200":
          description: OK
        default:
          $ref: "#/components/responses/Error"
  /triggers/{ref}/firings:
    get:
      operationId: listFirings
      summary: List a trigger's firings, newest first
      x-topos-actions:
        - trigger.read
      parameters:
        - name: ref
          in: path
          required: true
          description: An id, which names its object whoever owns it, subject to the authorizer, or a name, read among the caller's own objects. A name only another subject holds answers not_found, as one nobody holds does.
          schema:
            type: string
      responses:
        "200":
          description: OK
        default:
          $ref: "#/components/responses/Error"
  /openapi.yaml:
    get:
      operationId: getOpenAPI
      summary: This document
      security: []
      responses:
        "200":
          description: OK
        default:
          $ref: "#/components/responses/Error"
components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Delta:
      type: object
      description: "One live frame of a session's response as it arrives, the data of an event: delta frame. A frame of text is {thread, turn, step, block, kind, text}: text is the next run of the content block's text, thinking or tool input, to append to what the step's earlier deltas carried for that block. A reset is {thread, turn, step, reset}: the step's request is sent again, so what its deltas carried is discarded. Deltas are best effort: never appended, never replayed, and dropped rather than slowing the turn; the step's agent.message is the record, so a client that misses deltas loses nothing, and a delta of a step whose agent.message the client holds is stale."
      required:
        - turn
        - step
      properties:
        thread:
          type: string
          description: The thread whose response it is; absent for the session's own thread, as on events.
        turn:
          type: integer
          minimum: 1
        step:
          type: integer
          minimum: 1
        block:
          type: integer
          minimum: 0
          description: The index of the response's content block the text belongs to.
        kind:
          type: string
          enum:
            - text
            - thinking
            - tool_input
          description: "What the text is part of: a text block, a thinking block, or a tool call's arguments as the model writes them."
        text:
          type: string
          description: At most 1024 bytes; a longer run arrives as several deltas.
        reset:
          type: boolean
          const: true
          description: Present only on a reset.
    Error:
      type: object
      required:
        - error
      properties:
        error:
          type: object
          required:
            - code
            - message
          properties:
            code:
              type: string
              enum:
                - agent_identity_missing
                - attachment_too_large
                - authorizer_unavailable
                - confirmation_required
                - conflict
                - forbidden
                - idempotency_conflict
                - identity_refused
                - identity_unavailable
                - internal
                - invalid_fork_point
                - invalid_manifest
                - invalid_request
                - machine_unavailable
                - manifest_holds_secret
                - model_unavailable
                - model_unknown
                - not_found
                - payload_too_large
                - rate_limited
                - sequence_conflict
                - unauthenticated
                - unknown_reference
                - unsupported_version
            message:
              type: string
            details:
              type: object
              description: What a developer reads about the refusal; message is the sentence a person reads. A not_found carries no details.
              properties:
                detail:
                  type: string
                  description: What was refused and why, for a log or a verbose view.
                problems:
                  type: array
                  description: A refused manifest's problems, each at its document (from 1) and field path.
                  items:
                    type: object
                    properties:
                      document:
                        type: integer
                      path:
                        type: string
                      detail:
                        type: string
                reason:
                  type: string
                  description: On forbidden, the installation's authorizer's reason for its deny, a stable snake_case token such as not_owner or agents_not_enabled, which a client may branch on. The authorizer owns the vocabulary. It is absent when the authorizer gave none or gave text of another shape, and on a session create of another subject's agent the caller may not read.
  responses:
    Error:
      description: "An error of the table. By status: 400: confirmation_required, invalid_manifest, invalid_request, manifest_holds_secret, unknown_reference, unsupported_version; 401: unauthenticated; 403: forbidden, identity_refused; 404: not_found; 409: agent_identity_missing, conflict, idempotency_conflict, sequence_conflict; 413: attachment_too_large, payload_too_large; 422: invalid_fork_point, machine_unavailable, model_unknown; 429: rate_limited; 500: internal; 503: authorizer_unavailable, identity_unavailable, model_unavailable."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
