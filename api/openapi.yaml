components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Delta:
      type: object
      description: "One live frame of a session's response as it arrives, the data of an event: delta frame. A frame of text is {thread, turn, step, block, kind, text}: text is the next run of the content block's text, thinking or tool input, to append to what the step's earlier deltas carried for that block. A reset is {thread, turn, step, reset}: the step's request is sent again, so what its deltas carried is discarded. Deltas are best effort: never appended, never replayed, and dropped rather than slowing the turn; the step's agent.message is the record, so a client that misses deltas loses nothing, and a delta of a step whose agent.message the client holds is stale."
      required:
        - turn
        - step
      properties:
        thread:
          type: string
          description: The thread whose response it is; absent for the session's own thread, as on events.
        turn:
          type: integer
          minimum: 1
        step:
          type: integer
          minimum: 1
        block:
          type: integer
          minimum: 0
          description: The index of the response's content block the text belongs to.
        kind:
          type: string
          enum:
            - text
            - thinking
            - tool_input
          description: "What the text is part of: a text block, a thinking block, or a tool call's arguments as the model writes them."
        text:
          type: string
          description: At most 1024 bytes; a longer run arrives as several deltas.
        reset:
          type: boolean
          const: true
          description: Present only on a reset.
    QuestionInput:
      description: "The input of a question call, as the agent.tool_use named question holds it once the runner checked it: no label is used twice in one question. A client shows each question with header as its short label and question in full, the options in the order given, each with label and description; marks each option whose recommended is true in its own words, the mark no part of the label; lets the person choose one option, or several where multiple is true, and always answer in their own words beside or in place of the options; shows a preview only on a question that takes one option, each item one line of plain text in a monospace font, spaces kept, and may collapse it, since the question is answerable without it; and treats every field as text a model wrote: no markup, and no link followed on its own."
      example:
        questions:
          - question: Which database should the new service keep its records in?
            header: Storage
            options:
              - label: Postgres
                description: The cluster the other services use. One more schema, no new operations work.
                recommended: true
              - label: SQLite
                description: A file beside the binary. Nothing to operate, and one writer at a time.
                preview:
                  - data/
                  - "  service.db"
                  - "  service.db-wal"
          - question: Which regions does the first release serve?
            header: Regions
            options:
              - label: Europe
                description: Where the current customers are.
              - label: North America
                description: Two prospects asked for it.
            multiple: true
      type: object
      properties:
        questions:
          type: array
          minItems: 1
          maxItems: 4
          description: The questions of this call, shown to the person together.
          items:
            type: object
            properties:
              question:
                type: string
                minLength: 1
                maxLength: 300
                description: The full question, answerable without reading the conversation.
              header:
                type: string
                minLength: 1
                maxLength: 12
                description: A short label for the question, such as a tab's title.
              options:
                type: array
                minItems: 2
                maxItems: 4
                description: The choices, in the order they are shown, the one you would take first.
                items:
                  type: object
                  properties:
                    label:
                      type: string
                      minLength: 1
                      maxLength: 40
                      description: The option's name, unique in its question.
                    description:
                      type: string
                      minLength: 1
                      maxLength: 200
                      description: "What choosing the option means: what follows from it and what it costs."
                    preview:
                      type: array
                      maxItems: 15
                      items:
                        type: string
                        maxLength: 40
                      description: A mockup or a snippet as lines of plain text, shown in a monospace font. Only on a question that takes one option.
                    recommended:
                      type: boolean
                      description: True on the option you would take.
                  required:
                    - label
                    - description
                  additionalProperties: false
              multiple:
                type: boolean
                description: True when the person may choose several options.
            required:
              - question
              - header
              - options
            additionalProperties: false
      required:
        - questions
      additionalProperties: false
    UserAnswer:
      type: object
      description: The payload of user.answer, one entry per question of the open question call, in the questions' order. The server sets sender to the caller.
      required:
        - tool_use_id
        - answers
      additionalProperties: false
      properties:
        tool_use_id:
          type: string
          description: The open question call's tool_use_id.
        answers:
          type: array
          minItems: 1
          maxItems: 4
          items:
            type: object
            additionalProperties: false
            properties:
              selected:
                type: array
                items:
                  type: string
                description: "The chosen labels: at most one where the question does not take several, each a label of the question and none twice."
              text:
                type: string
                maxLength: 2000
                description: The person's own words, in characters.
        sender:
          type: object
          readOnly: true
          description: The caller, set by the server whatever the body says.
    QuestionResultMeta:
      type: object
      description: The meta of a question call's tool.result, which says why the question closed without reading the result's text. The result's outcome is ok when an answer chose an option or held words, unanswered, which is not an error, when every entry of the answer was empty, a person's message came in place of an answer, or nobody attends the session, and canceled when an interrupt dismissed the question.
      properties:
        closed_by:
          type: string
          enum:
            - answer
            - message
            - interrupt
            - unattended
        event_id:
          type: string
          description: The id of the event that closed the call; absent when nobody attends the session.
    WebSearchResultMeta:
      type: object
      description: The meta of a web_search call's tool.result. An agent holds web_search only when its manifest names it, and each call sends its query to the search service the installation configures, with the session's own credential. The result's outcome is ok with the results, or with none; error when the service refused the search, the text then the service's own sentence for the person and refusal its code, or when the search failed; timeout past the search's timeout. A search the service charged for carries cost_usd_micro on the tool.result itself, beside meta, and the session's spent_cost_usd_micro counts it as it counts a model request's.
      properties:
        refusal:
          type: string
          description: The code the search service refused the search with; absent on a search it answered.
    Error:
      type: object
      required:
        - error
      properties:
        error:
          type: object
          required:
            - code
            - message
          properties:
            code:
              type: string
              enum:
                - agent_identity_missing
                - attachment_too_large
                - authorizer_unavailable
                - confirmation_required
                - conflict
                - file_too_large
                - file_unavailable
                - forbidden
                - idempotency_conflict
                - identity_refused
                - identity_unavailable
                - internal
                - invalid_fork_point
                - invalid_manifest
                - invalid_request
                - machine_unavailable
                - manifest_holds_secret
                - model_unavailable
                - model_unknown
                - not_found
                - payload_too_large
                - rate_limited
                - sequence_conflict
                - unauthenticated
                - unknown_reference
                - unsupported_version
            message:
              type: string
            details:
              type: object
              description: What a developer reads about the refusal; message is the sentence a person reads. A not_found carries no details.
              properties:
                detail:
                  type: string
                  description: What was refused and why, for a log or a verbose view.
                problems:
                  type: array
                  description: A refused manifest's problems, each at its document (from 1) and field path.
                  items:
                    type: object
                    properties:
                      document:
                        type: integer
                      path:
                        type: string
                      detail:
                        type: string
                reason:
                  type: string
                  description: On forbidden, the installation's authorizer's reason for its deny, a stable snake_case token such as not_owner or agents_not_enabled, which a client may branch on. The authorizer owns the vocabulary. It is absent when the authorizer gave none or gave text of another shape, and on a session create of another subject's agent the caller may not read.
                limits:
                  type: object
                  description: "On forbidden, the limits object the authorizer's deny carried, as it carried it, beside the reason and only with it: a deny for a bound that resets names when it does as resets_at, an RFC 3339 time, so a client says when the refused request can be sent again. The authorizer owns its members."
  responses:
    Error:
      description: "An error of the table. By status: 400: confirmation_required, invalid_manifest, invalid_request, manifest_holds_secret, unknown_reference, unsupported_version; 401: unauthenticated; 403: forbidden, identity_refused; 404: not_found; 409: agent_identity_missing, conflict, file_unavailable, idempotency_conflict, sequence_conflict; 413: attachment_too_large, file_too_large, payload_too_large; 422: invalid_fork_point, machine_unavailable, model_unknown; 429: rate_limited; 500: internal; 503: authorizer_unavailable, identity_unavailable, model_unavailable."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
