openapi: 3.1.0
info:
  title: Topos API
  version: v1
  description: Agents, their versions, the sessions people have with them, and the triggers that start and continue sessions on a schedule or on delivered events. Every route is verified and asked of the installation's authorizer; every error is one envelope with a code of the table under components.schemas.Error.
servers:
  - url: /v1
security:
  - bearer: []
paths:
  /agents/{name}:
    put:
      operationId: applyAgent
      summary: Apply an agent
      description: "Apply an Agent manifest to the agent of the name in the caller's context; a changed spec creates a version. The body is one Agent manifest of topos.latere.ai/v1. metadata.name is the agent's identifier, a DNS label equal to the path's name. metadata.displayName, optional, is the name a person reads: text on one line of at most 200 characters, without control characters, line breaks or bidirectional controls; an agent without one is shown by its name. A changed spec creates the next version. A change to the metadata alone (the display name, labels, annotations) creates none: it replaces the latest version's metadata, and every later read returns it."
      x-topos-actions:
        - agent.create
        - agent.update
        - agent.read
      parameters:
        - name: name
          in: path
          required: true
          description: The name, unique within its owner. An agent belongs to the organization the caller's token names, or to the caller as a person when it names none. An agent's name is read among that owner's agents, a trigger's among the caller's own triggers. An apply acts on the object of the name and creates it when there is none; an object of the name another owner holds is neither read nor changed.
          schema:
            type: string
      requestBody:
        content:
          application/json:
            example:
              apiVersion: topos.latere.ai/v1
              kind: Agent
              metadata:
                name: release-notes
                displayName: Release notes
              spec:
                model:
                  name: claude-haiku-4-5
                instructions: Write the release notes for a tag from the pull requests merged since the tag before it.
                machine:
                  kind: cella
          application/yaml:
            example: |
              apiVersion: topos.latere.ai/v1
              kind: Agent
              metadata:
                name: release-notes
                displayName: Release notes
              spec:
                model:
                  name: claude-haiku-4-5
                instructions: Write the release notes for a tag from the pull requests merged since the tag before it.
                machine:
                  kind: cella
      responses:
        "200":
          description: "OK: the object existed, and the apply changed it or left it as it was."
          content:
            application/json:
              example:
                apiVersion: topos.latere.ai/v1
                kind: Agent
                metadata:
                  name: release-notes
                  displayName: Release notes
                spec:
                  model:
                    name: claude-haiku-4-5
                  instructions: Write the release notes for a tag from the pull requests merged since the tag before it.
                  tools:
                    - read
                    - write
                    - edit
                    - bash
                    - grep
                    - glob
                    - web_fetch
                    - todo
                  approvals:
                    mode: confirm
                    thresholds:
                      flagAt: 0.3
                      askAt: 0.5
                      blockAt: 0.9
                  threads:
                    maxDepth: 2
                    maxConcurrent: 8
                  machine:
                    kind: cella
                    image: base
                  limits:
                    turnTimeout: 2h
                    maxAge: 168h
                  context:
                    compactAt: 0.8
                status:
                  id: agent_01M34FSDG0Q60424XT3D96DRAJ
                  version: 3
                  digest: sha256:dac7fd51151199dc6af109f5da3680a4e7485daf2bc6191a047261ae75933aa9
                  createdAt: "2026-09-22T12:02:00Z"
        "201":
          description: "Created: the apply created the object."
          content:
            application/json:
              example:
                apiVersion: topos.latere.ai/v1
                kind: Agent
                metadata:
                  name: release-notes
                  displayName: Release notes
                spec:
                  model:
                    name: claude-haiku-4-5
                  instructions: Write the release notes for a tag from the pull requests merged since the tag before it.
                  tools:
                    - read
                    - write
                    - edit
                    - bash
                    - grep
                    - glob
                    - web_fetch
                    - todo
                  approvals:
                    mode: confirm
                    thresholds:
                      flagAt: 0.3
                      askAt: 0.5
                      blockAt: 0.9
                  threads:
                    maxDepth: 2
                    maxConcurrent: 8
                  machine:
                    kind: cella
