  /sessions:
    post:
      operationId: createSession
      summary: Create a session
      description: "Create a session of an agent, named by id or by name among the agents of the caller's context. The body's attended, true when a person answers the session's questions through a client that shows them, is the session's from its create on and nothing changes it: an agent's question then waits, the session idle with stop_reason question, until a user.answer, a person's user.message or a user.interrupt closes it, holding no runner while it waits; absent or false, a question is answered at once with outcome unanswered and the agent decides, so a client that shows no questions never meets one. The body's metadata is an object of at most 32 strings, each key a letter or digit, then at most 62 letters, digits, dots, underscores or hyphens, each value at most 512 bytes without a control character; any other is invalid_request. The session holds it as given, a fork holds the metadata of the session it forks, and the authorizer's session.create and session.fork carry it as metadata, absent when there is none. The authorizer's allow of session.create or session.fork may attach repositories, each {url, ref, app}, app {slug, name, url} the app at the installation's app host it is the source of, which follow the request's resources marked attached, one whose url the request names left out, at most 8 repositories together; and context, titled text {title, text} of at most 32768 bytes together, which the model reads after the initiator's instructions for the session's whole life. An app's repository is delivered into the directory of its slug under the working directory, on the session's branch at the commit the app serves. A fork carries the repositories its parent's request named, and what its own allow attaches; a request that names a repository's app or marks one attached is invalid_request. The session runs its agent's model at its agent's reasoning level, and its model is absent from the answer. Where the installation's authorizer names another model or another reasoning level for it, the session starts on that one: its model is {name, via, reasoning}, name the model that runs, via the agent's own name for it when the model is another, which a client that offers the choice shows, and reasoning the level it runs at. The model that runs is checked after the authorizer is asked: one no source gives an input window and an output limit is model_unknown, and a gateway that does not answer model_unavailable. The session's network is what its machine may reach, network {mode, hosts, ask, source}: mode open, allowlist or none, the one the authorizer's allow names with source authorizer, or the agent's spec.machine egressMode with ask false and source agent. Under allowlist the agent's spec.machine.egress, the hosts of the session's named secrets and the git hosts of its repositories are always joined. A web_fetch of a host inside the network runs without asking, its reason \"inside the session's network\"; one outside it asks, its reason \"outside the session's network\", when ask is true and the session is attended, and is blocked otherwise. The allow may carry the initiator's standing instructions, at most 8192 bytes of UTF-8, which the session records as instructions and its model reads after its agent's own; no send changes them."
      x-topos-actions:
        - session.create
      requestBody:
        content:
          application/json:
            example:
              agent: release-notes
              message: Write the release notes for v1.4.0.
              title: Notes for v1.4.0
              attended: true
      responses:
        "201":
          description: Created
          content:
            application/json:
              example:
                schema: 1
                id: ses_01M34G2JF01B91B8399CD1G6YP
                agent:
                  id: agent_01M34FSDG0Q60424XT3D96DRAJ
                  name: release-notes
                  version: 3
                  digest: sha256:dac7fd51151199dc6af109f5da3680a4e7485daf2bc6191a047261ae75933aa9
                  bundle: sha256:b5790eaab58e675da4a3732b7a53afea7b61c87bc3810b06772c64fae9f986ec
                title: Notes for v1.4.0
                initiator:
                  subject: https://login.example|alice
                  kind: person
                runner: hosted
                status: idle
                turn: 0
                last_seq: 1
                machine:
                  kind: cella
                  image: base
                policy:
                  mode: confirm
                  thresholds:
                    flag_at: 0.3
                    ask_at: 0.5
                    block_at: 0.9
                budget:
                  spent_cost_usd_micro: 0
                limits:
                  turn_timeout: 2h0m0s
                  max_age: 168h0m0s
                capture: {}
                attended: true
                network:
                  mode: allowlist
                  source: agent
                created_at: "2026-09-22T12:05:00Z"
                updated_at: "2026-09-22T12:05:00Z"
                expires_at: "2026-09-29T12:05:00Z"
        default:
          $ref: "#/components/responses/Error"
    get:
      operationId: listSessions
      summary: List sessions
      description: "List the sessions of the agents of the caller's context, filtered by agent, status, runner and archived, newest first by id. A fork names the session it was forked from as parent {session_id, seq} and the session at the top of its fork tree as root; a session no fork made has neither, and its tree is keyed by its own id. root, parent and group narrow what the other filters and the authorizer's owners keep, so a tree's sessions the caller may not list are in no answer and no count. root lists a tree, parent a session's forks, and group=tree one session per tree: the newest of the tree's sessions the list keeps, the one with the greatest id, carrying tree {root, sessions}, root the tree's key and sessions how many of the tree's sessions the list keeps. A grouped list orders and pages by the id of each tree's newest session, so a fork moves its tree to the head of the list. A group other than tree is invalid_request. metadata.<key>=<value>, one such parameter per request, keeps the sessions whose metadata holds key with exactly value, beside every other filter and within the owners the authorizer's decision names; under group=tree a tree stands for itself when one of its sessions holds the entry. A second such parameter, a key that breaks the key rule of a create's metadata, and an empty value are invalid_request naming the parameter."
      x-topos-actions:
        - session.list
      parameters:
        - name: agent
          in: query
          description: An agent's id, or a name among the agents of the caller's context.
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
            enum:
              - idle
              - running
              - ended
        - name: runner
          in: query
          schema:
            type: string
            enum:
              - hosted
              - external
        - name: archived
          in: query
          description: false or absent leaves archived sessions out, true lists only them, any lists both.
          schema:
            type: string
            enum:
              - "false"
              - "true"
              - any
        - name: root
          in: query
          description: "A session's id: that session and every session whose root it is, the sessions of its fork tree when it is the tree's root."
          schema:
            type: string
        - name: parent
          in: query
          description: "A session's id: the sessions forked from that session, at any sequence."
          schema:
            type: string
        - name: group
          in: query
          description: tree lists one session per fork tree, the newest of the tree's sessions the other filters keep, each carrying tree {root, sessions}.
          schema:
            type: string
            enum:
              - tree
      responses:
        "200":
          description: OK
          content:
            application/json:
              example:
                items:
                  - schema: 1
                    id: ses_01M34G2JF01B91B8399CD1G6YP
                    agent:
                      id: agent_01M34FSDG0Q60424XT3D96DRAJ
                      name: release-notes
                      version: 3
                      digest: sha256:dac7fd51151199dc6af109f5da3680a4e7485daf2bc6191a047261ae75933aa9
                      bundle: sha256:b5790eaab58e675da4a3732b7a53afea7b61c87bc3810b06772c64fae9f986ec
                    title: Notes for v1.4.0
                    initiator:
                      subject: https://login.example|alice
                      kind: person
                    runner: hosted
                    status: idle
                    stop_reason: end_turn
                    turn: 1
                    last_seq: 5
                    machine:
                      kind: cella
                      image: base
                    policy:
                      mode: confirm
                      thresholds:
                        flag_at: 0.3
                        ask_at: 0.5
                        block_at: 0.9
                    budget:
                      spent_cost_usd_micro: 1200
                    limits:
                      turn_timeout: 2h0m0s
                      max_age: 168h0m0s
                    capture: {}
                    attended: true
                    network:
                      mode: allowlist
                      source: agent
                    created_at: "2026-09-22T12:05:00Z"
                    updated_at: "2026-09-22T12:05:41Z"
                    expires_at: "2026-09-29T12:05:00Z"
                next_cursor: ses_01M34G2JF01B91B8399CD1G6YP
        default:
          $ref: "#/components/responses/Error"
  /sessions/summary:
    get:
      operationId: getSessionSummary
      summary: Count sessions
      description: "The answer is {\"sessions\": {\"running\", \"waiting_for_approval\", \"idle\", \"ended\"}, \"agents\"}, counts of the sessions GET /sessions would list for the caller under the same agent, runner, archived and metadata.<key> filters, archived sessions left out unless archived asks for them; it counts sessions, and takes none of the list's root, parent and group. The four counts are disjoint: running and ended are the sessions of that status, waiting_for_approval the idle sessions whose stop_reason is tool_confirmation, where a call or an approval waits for a person, and idle every other idle session, those idle on question, where a question waits for a person's answer, among them; agents is the number of distinct agents among the sessions counted. The route asks session.list with the list's fields and applies the owners its decision narrows to, as the list does; an agent name the caller holds no agent of answers every count zero."
      x-topos-actions:
        - session.list
      parameters:
        - name: agent
          in: query
          description: An agent's id, or a name among the agents of the caller's context.
          schema:
            type: string
        - name: runner
          in: query
          schema:
            type: string
            enum:
              - hosted
              - external
        - name: archived
          in: query
          description: false or absent leaves archived sessions out, true lists only them, any lists both.
          schema:
            type: string
            enum:
              - "false"
              - "true"
              - any
      responses:
        "200":
          description: OK
          content:
            application/json:
              example:
                sessions:
                  running: 0
                  waiting_for_approval: 0
                  idle: 2
                  ended: 0
                agents: 1
        default:
          $ref: "#/components/responses/Error"
  /sessions/search:
    get:
      operationId: searchSessions
      summary: Search sessions
      description: "Search the sessions GET /sessions would list for the caller by what was said in them: the text of each message a person sent and each answer the agent wrote on the session's own thread, and a person's answers to the agent's questions; never a tool's output, a subagent's thread, a file, or a redacted event. A message matches when it holds every word of q. Markdown's marks and a link's address are not searched, and a message is searched in its first 65536 bytes. The answer is a page of {session, matches}, at most limit sessions, newest first by id as the list orders them, with next_cursor while more follow. matches are the session's newest 3 matching events, newest first, each {seq, event_id, type, time, excerpt}: seq is the event's place in the log, a client's way to show it in the conversation, and excerpt at most 160 characters around the first match, as fragments of text with match true on each part q matched and … where the message is cut. The route asks session.list with the list's fields and searches the sessions the list would, then asks session.read of each session it found, as a read of its log does: a session the caller may not read is left out, so a page may hold fewer sessions than limit while next_cursor remains. A fork holds its parent's events, so a session and the session it was forked from can both match. A q that is empty, holds no word, or is longer than 200 characters is invalid_request."
      x-topos-actions:
        - session.list
        - session.read
      parameters:
        - name: q
          in: query
          required: true
          description: The words to search for. Each is found as the start of a word, whatever its case; characters of Han, Hiragana and Katakana typed in a row are found as those characters in a row.
          schema:
            type: string
            minLength: 1
            maxLength: 200
        - name: limit
          in: query
          description: How many sessions a page holds at most; 20 when absent.
          schema:
            type: integer
            minimum: 1
            maximum: 20
        - name: cursor
          in: query
          description: The next_cursor of the page before.
          schema:
            type: string
        - name: agent
          in: query
          description: An agent's id, or a name among the agents of the caller's context.
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
            enum:
              - idle
              - running
              - ended
        - name: runner
          in: query
          schema:
            type: string
            enum:
