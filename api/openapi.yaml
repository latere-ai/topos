openapi: 3.1.0
info:
  title: Topos API
  version: v1
  description: Agents, their versions, and the sessions people have with them. Every route is verified and asked of the installation's authorizer; every error is one envelope with a code of the table under components.schemas.Error.
servers:
  - url: /v1
security:
  - bearer: []
paths:
  /agents/{name}:
    put:
      operationId: applyAgent
      summary: Apply an Agent manifest to the caller's own agent of the name; a changed spec creates a version
      description: "The body is one Agent manifest of topos.latere.ai/v1. metadata.name is the agent's identifier, a DNS label equal to the path's name. metadata.displayName, optional, is the name a person reads: text on one line of at most 200 characters, without control characters, line breaks or bidirectional controls; an agent without one is shown by its name. A changed spec creates the next version. A change to the metadata alone (the display name, labels, annotations) creates none: it replaces the latest version's metadata, and every later read returns it."
      x-topos-actions:
        - agent.create
        - agent.update
        - agent.read
      parameters:
        - name: name
          in: path
          required: true
          description: The name, unique within its owner, the subject that applied it. An apply acts on the caller's own object of the name and creates it when the caller holds none; an object of the name another subject holds is neither read nor changed.
          schema:
            type: string
      requestBody:
        content:
          application/json: {}
          application/yaml: {}
      responses:
        "200":
          description: OK
        default:
          $ref: "#/components/responses/Error"
  /agents:
    get:
      operationId: listAgents
      summary: List agents
      x-topos-actions:
        - agent.list
      responses:
        "200":
          description: OK
        default:
          $ref: "#/components/responses/Error"
  /agents/{ref}:
    get:
      operationId: getAgent
      summary: Get an agent's latest version by id, or by name among the caller's own agents
      x-topos-actions:
        - agent.read
      parameters:
        - name: ref
          in: path
          required: true
          description: An id, which names its object whoever owns it, subject to the authorizer, or a name, read among the caller's own objects. A name only another subject holds answers not_found, as one nobody holds does.
          schema:
            type: string
      responses:
        "200":
          description: OK
        default:
          $ref: "#/components/responses/Error"
  /agents/{ref}/versions:
    get:
      operationId: listAgentVersions
      summary: List an agent's versions
      x-topos-actions:
        - agent.read
      parameters:
        - name: ref
          in: path
          required: true
          description: An id, which names its object whoever owns it, subject to the authorizer, or a name, read among the caller's own objects. A name only another subject holds answers not_found, as one nobody holds does.
          schema:
            type: string
      responses:
        "200":
          description: OK
        default:
          $ref: "#/components/responses/Error"
  /agents/{ref}/versions/{n}:
    get:
      operationId: getAgentVersion
      summary: Get one version of an agent
      x-topos-actions:
        - agent.read
      parameters:
        - name: ref
          in: path
          required: true
          description: An id, which names its object whoever owns it, subject to the authorizer, or a name, read among the caller's own objects. A name only another subject holds answers not_found, as one nobody holds does.
          schema:
            type: string
        - name: "n"
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
        default:
          $ref: "#/components/responses/Error"
  /agents/{ref}/archive:
    post:
      operationId: archiveAgent
      summary: Archive an agent; running sessions keep their version
      x-topos-actions:
        - agent.archive
      parameters:
        - name: ref
          in: path
          required: true
          description: An id, which names its object whoever owns it, subject to the authorizer, or a name, read among the caller's own objects. A name only another subject holds answers not_found, as one nobody holds does.
          schema:
            type: string
      requestBody:
        content:
          application/json: {}
      responses:
        "200":
          description: OK
        default:
          $ref: "#/components/responses/Error"
  /sessions:
    post:
      operationId: createSession
      summary: Create a session of an agent, named by id or by name among the caller's own agents
      x-topos-actions:
        - session.create
      requestBody:
        content:
          application/json: {}
      responses:
        "201":
          description: Created
        default:
          $ref: "#/components/responses/Error"
    get:
      operationId: listSessions
      summary: List sessions, filtered by agent, status and runner
      x-topos-actions:
        - session.list
      responses:
        "200":
          description: OK
        default:
          $ref: "#/components/responses/Error"
  /sessions/{id}:
    get:
      operationId: getSession
      summary: Get a session
      x-topos-actions:
        - session.read
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
        default:
          $ref: "#/components/responses/Error"
    patch:
      operationId: updateSession
      summary: Change the model the session's next turn runs
      description: "The body is {\"model\": {\"name\": \"<model>\"}}, the model the session's next turn runs; any other member is refused. The agent's own model's name is the agent's spec.model as it names it, and any other name is that model through the installation's model connection. A model no source gives an input window and an output limit is model_unknown, and a gateway that does not answer model_unavailable; the authorizer is asked session.update with session_id and model after the model resolved, and a deny is forbidden. An allowed switch appends session.model_changed {by, old, new} and answers the Session, whose model is the new one; a switch to the model the session runs appends nothing. A turn already running keeps its model: the switch takes effect at the next turn."
      x-topos-actions:
        - session.update
        - session.read
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json: {}
      responses:
        "200":
          description: OK
        default:
          $ref: "#/components/responses/Error"
    delete:
      operationId: deleteSession
      summary: Delete a session, its log and its blobs
      x-topos-actions:
        - session.delete
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: No Content
        default:
          $ref: "#/components/responses/Error"
  /sessions/{id}/end:
    post:
      operationId: endSession
      summary: End an idle session completed or canceled
      x-topos-actions:
        - session.end
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json: {}
      responses:
        "200":
          description: OK
        default:
          $ref: "#/components/responses/Error"
  /sessions/{id}/resume:
    post:
      operationId: resumeSession
      summary: Resume a session idle on its budget once the cap is raised
      x-topos-actions:
        - session.resume
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json: {}
      responses:
        "200":
          description: OK
        default:
          $ref: "#/components/responses/Error"
  /sessions/{id}/events:
    get:
      operationId: listEvents
      summary: List a session's events from a sequence
      x-topos-actions:
        - session.read
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: sendEvent
      summary: Send one user event
      x-topos-actions:
        - session.send
        - session.interrupt
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json: {}
      responses:
        "200":
          description: OK
        default:
          $ref: "#/components/responses/Error"
  /sessions/{id}/stream:
    get:
      operationId: streamEvents
      summary: Stream a session's events as Server-Sent Events
      x-topos-actions:
        - session.read
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
        default:
          $ref: "#/components/responses/Error"
  /sessions/{id}/blobs/{digest}:
    get:
      operationId: getBlob
      summary: Get a blob of a session
      x-topos-actions:
        - session.read
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: digest
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
        default:
          $ref: "#/components/responses/Error"
  /sessions/{id}/events/{event_id}/redact:
    post:
      operationId: redactEvent
      summary: Replace one event's content with a tombstone
      x-topos-actions:
        - session.redact
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: event_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json: {}
      responses:
        "204":
          description: No Content
        default:
          $ref: "#/components/responses/Error"
  /openapi.yaml:
    get:
      operationId: getOpenAPI
      summary: This document
      security: []
      responses:
        "200":
          description: OK
        default:
          $ref: "#/components/responses/Error"
components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Error:
      type: object
      required:
        - error
      properties:
        error:
          type: object
          required:
            - code
            - message
          properties:
            code:
              type: string
              enum:
                - agent_identity_missing
                - authorizer_unavailable
                - confirmation_required
                - conflict
                - forbidden
                - idempotency_conflict
                - identity_refused
                - identity_unavailable
                - internal
                - invalid_manifest
                - invalid_request
                - machine_unavailable
                - manifest_holds_secret
                - model_unavailable
                - model_unknown
                - not_found
                - payload_too_large
                - rate_limited
                - sequence_conflict
                - unauthenticated
                - unknown_reference
                - unsupported_version
            message:
              type: string
            details:
              type: object
              description: What a developer reads about the refusal; message is the sentence a person reads. A not_found carries no details.
              properties:
                detail:
                  type: string
                  description: What was refused and why, for a log or a verbose view.
                problems:
                  type: array
                  description: A refused manifest's problems, each at its document (from 1) and field path.
                  items:
                    type: object
                    properties:
                      document:
                        type: integer
                      path:
                        type: string
                      detail:
                        type: string
                reason:
                  type: string
                  description: On forbidden, the installation's authorizer's reason for its deny, a stable snake_case token such as not_owner or agents_not_enabled, which a client may branch on. The authorizer owns the vocabulary. It is absent when the authorizer gave none or gave text of another shape, and on a session create of another subject's agent the caller may not read.
  responses:
    Error:
      description: "An error of the table. By status: 400: confirmation_required, invalid_manifest, invalid_request, manifest_holds_secret, unknown_reference, unsupported_version; 401: unauthenticated; 403: forbidden, identity_refused; 404: not_found; 409: agent_identity_missing, conflict, idempotency_conflict, sequence_conflict; 413: payload_too_large; 422: machine_unavailable, model_unknown; 429: rate_limited; 500: internal; 503: authorizer_unavailable, identity_unavailable, model_unavailable."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
