  /sessions:
    post:
      operationId: createSession
      summary: Create a session
      description: "Create a session of an agent, named by id or by name among the agents of the caller's context. The body's attended, true when a person answers the session's questions through a client that shows them, is the session's from its create on and nothing changes it: an agent's question then waits, the session idle with stop_reason question, until a user.answer, a person's user.message or a user.interrupt closes it, holding no runner while it waits; absent or false, a question is answered at once with outcome unanswered and the agent decides, so a client that shows no questions never meets one. The session runs its agent's model, and its model is absent from the answer. Where the installation's authorizer names another model for it, the session starts on that one: its model is {name, via, effort}, name the model that runs and via the agent's own name for it, which a client that offers the choice shows. The model that runs is checked after the authorizer is asked: one no source gives an input window and an output limit is model_unknown, and a gateway that does not answer model_unavailable."
      x-topos-actions:
        - session.create
      requestBody:
        content:
          application/json:
            example:
              agent: release-notes
              message: Write the release notes for v1.4.0.
              title: Notes for v1.4.0
              attended: true
      responses:
        "201":
          description: Created
          content:
            application/json:
              example:
                schema: 1
                id: ses_01M34G2JF01B91B8399CD1G6YP
                agent:
                  id: agent_01M34FSDG0Q60424XT3D96DRAJ
                  name: release-notes
                  version: 3
                  digest: sha256:dac7fd51151199dc6af109f5da3680a4e7485daf2bc6191a047261ae75933aa9
                  bundle: sha256:b5790eaab58e675da4a3732b7a53afea7b61c87bc3810b06772c64fae9f986ec
                title: Notes for v1.4.0
                initiator:
                  subject: https://login.example|alice
                  kind: person
                runner: hosted
                status: idle
                turn: 0
                last_seq: 1
                machine:
                  kind: cella
                  image: base
                policy:
                  mode: confirm
                  thresholds:
                    flag_at: 0.3
                    ask_at: 0.5
                    block_at: 0.9
                budget:
                  spent_cost_usd_micro: 0
                limits:
                  turn_timeout: 2h0m0s
                  max_age: 168h0m0s
                capture: {}
                attended: true
                created_at: "2026-09-22T12:05:00Z"
                updated_at: "2026-09-22T12:05:00Z"
                expires_at: "2026-09-29T12:05:00Z"
        default:
          $ref: "#/components/responses/Error"
    get:
      operationId: listSessions
      summary: List sessions
      description: List the sessions of the agents of the caller's context, filtered by agent, status, runner and archived.
      x-topos-actions:
        - session.list
      parameters:
        - name: agent
          in: query
          description: An agent's id, or a name among the agents of the caller's context.
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
            enum:
              - idle
              - running
              - ended
        - name: runner
          in: query
          schema:
            type: string
            enum:
              - hosted
              - external
        - name: archived
          in: query
          description: false or absent leaves archived sessions out, true lists only them, any lists both.
          schema:
            type: string
            enum:
              - "false"
              - "true"
              - any
      responses:
        "200":
