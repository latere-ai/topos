    post:
      operationId: sendEvent
      summary: Send a user event
      description: "The body is one user event, {\"type\", \"payload\"}: user.message, user.interrupt, user.tool_confirmation, user.tool_result or user.answer. A user.message's payload holds content, text blocks {\"type\":\"text\",\"text\"} and inline images {\"type\":\"image\",\"image\":{\"media_type\",\"data\"}} (PNG, JPEG, GIF or WebP, base64, at most 8 of at most 5242880 bytes each), and attachments, files {\"name\",\"media_type\",\"data\"} (base64, at most 8 of at most 5242880 bytes each, the name one path segment of at most 255 bytes). The server stores each file as a blob of the session and records it as {name, media_type, size, blob, path}, path attachments/<event id>/<name>, in a directory of the message's own, and no two files of one message share a name; the runner writes it at that path in the working directory when the session's machine opens, or before the next step when it is open, and the model reads the paths in the message. An image reaches a model whose figures say it takes images, and is a note that it cannot see it otherwise. An image or a file past its limit is attachment_too_large; the body is at most 8388608 bytes. The authorizer's allow of a message, a confirmation or a result may name another model than the one the session runs: session.model_changed {by, old, new} is then appended straight before the event, its by the service {subject: service:authorizer, kind: service} and not the sender, the session's model is the new one with the name it was asked by as via, and the turn the event starts runs on it. A turn already running keeps its model. A model the installation does not run refuses the send as model_unknown or model_unavailable. A user.tool_confirmation, a user.tool_result and a user.answer each answer one call that waits for exactly that answer, and are appended only after the log they were checked against: of two sent at once one is appended and the other is conflict, and one that names a call nothing waits on, or one something else answered, is conflict. A person's user.message denies every call that waits for a confirmation, with the message's text as the person's note, and closes an open question in place of an answer. A user.answer answers the session's open question, the agent.tool_use named question that nothing closed, of which there is at most one; its payload is a UserAnswer, {tool_use_id, answers}, one entry {selected, text} per question in the questions' order: selected the chosen labels, text the person's own words of at most 2000 characters. An entry with text alone answers in the person's words, one with both is a choice and a note on it, an empty entry leaves its question to the agent, and an answer of empty entries leaves every question to it. For example {\"type\":\"user.answer\",\"payload\":{\"tool_use_id\":\"toolu_01\",\"answers\":[{\"selected\":[\"SQLite\"],\"text\":\"we have nobody to run a second schema\"},{}]}}. It is asked of the authorizer as session.send with event_type user.answer, and its shape is checked before that question, as invalid_request. After the allow, an answer that names no open question is conflict, the detail saying what closed the question; one with another number of entries than questions, a label that is no option of its question or one named twice, or several labels on a question that does not take several, is invalid_request. Nothing is appended for a refused answer. An answer is final once appended: the reply and the stream carry it, and a correction is a message. The runner renders it into the call's tool.result, outcome ok, or unanswered when every entry is empty, with a QuestionResultMeta."
      x-topos-actions:
        - session.send
        - session.interrupt
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
