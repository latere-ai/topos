                  context:
                    compactAt: 0.8
                status:
                  id: agent_01M34FSDG0Q60424XT3D96DRAJ
                  version: 1
                  digest: sha256:dac7fd51151199dc6af109f5da3680a4e7485daf2bc6191a047261ae75933aa9
