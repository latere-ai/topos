      summary: Stream session events
      description: "Server-Sent Events: every event of the log from from_seq, or after the sequence a Last-Event-ID header names, then each new one as it is appended, from any replica, each a frame of id: <seq>, event: <type> and data: <the event's JSON>. A comment line is sent every 15 seconds, and the stream closes after the event that ends the session. With deltas=1 the stream also carries the session's live output while a response arrives, best effort: frames of event: delta whose data is a Delta, with no id, so a reconnect with the browser's last event id resumes the log where it was. A delta is never appended and never replayed. A subject holds at most 16 streams open at once on one replica; the next is rate_limited. files.kept {message, files, skipped} follows an agent.message of the session's own thread that names local images, once the message's step is committed and before the turn's session.status: message is the agent.message's id, files each {path, resolved, blob, media_type, size, width, height} for an image kept as a blob of the session, path the destination as the message wrote it, and skipped each {path, reason}, reason one of not_found, too_large, not_an_image, outside_workdir, no_machine, limit and unavailable. An image is named by a Markdown image or an HTML img element's src whose destination has no scheme or the file: scheme, inside the working directory; the first 8 of a message are read, each PNG, JPEG, GIF or WebP by its bytes, never an SVG, at most 5242880 bytes, 8192 pixels a side and 40000000 pixels, from a machine the turn opened, never one opened to keep it. A client draws a reference from the blob its path names, and reads the files route for one no files.kept recorded; a client that does not know the type skips it."
