                        block_at: 0.9
                    budget:
                      spent_cost_usd_micro: 1200
                    limits:
                      turn_timeout: 2h0m0s
                      max_age: 168h0m0s
                    capture: {}
                    attended: true
                    created_at: "2026-09-22T12:05:00Z"
                    updated_at: "2026-09-22T12:05:41Z"
                    expires_at: "2026-09-29T12:05:00Z"
