            application/json:
              example:
                id: evt_01M34GFCM0MP2SWWWVFVJH1PW2
                seq: 8
                session_id: ses_01M34G2JF01B91B8399CD1G6YP
                type: user.message
                time: "2026-09-22T12:12:00Z"
                payload:
