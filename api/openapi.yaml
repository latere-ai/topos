                expires_at: "2026-09-29T12:05:00Z"
        default:
          $ref: "#/components/responses/Error"
    patch:
      operationId: updateSession
      summary: Change a session's model
      description: "The body is {\"model\": {\"name\": \"<model>\", \"effort\": \"<effort>\"}, \"policy\": {\"mode\": \"<mode>\"}}: the model the session's next turn runs and its reasoning effort, either member or both, and the approval mode its next steps decide calls under, one of plan, confirm, progressive. The body names model, policy or both; any other member is refused. A member left out keeps what the session runs. effort is one of minimal, low, medium, high, or empty to return to the agent's own; it holds across a change of the model, and a model that takes no reasoning effort ignores it. The agent's own model's name is the agent's spec.model as it names it, and any other name is that model through the installation's model connection. The authorizer is asked session.update with session_id, model when the body names one, and effort, the effort the next turn runs at, when the body names one, and a deny is forbidden. Its allow may name the model to run in place of the one the body names: the session then runs that model, and its model's via is the name the body asked, which a client that offers the choice shows; via is absent when the session runs the name asked. The model that runs is checked after the authorizer is asked: one no source gives an input window and an output limit is model_unknown, and a gateway that does not answer model_unavailable. An allowed change appends session.model_changed {by, old, new}, each {name, via, effort}, and answers the Session, whose model is the new one; a change to the model and the effort the session runs appends nothing. A turn already running keeps its model and its effort: the change takes effect at the next turn. A change of the mode asks the same session.update with approval_mode, current_approval_mode, the mode the session runs, and agent_approval_mode, the mode its agent names and the session started in. It appends session.policy_changed {by, old, new}, each {mode}, in the same batch as a change of the model, and the Session's policy.mode is the new one; its lists and thresholds do not change. The mode holds from the next step, in the turn that runs: a call decided before keeps its verdict, and a call waiting for a confirmation keeps waiting for the person's answer whichever way the mode moved. A thread runs no looser than the modes its own agents name, and a host with no operating-system sandbox decides progressive as confirm."
      x-topos-actions:
        - session.update
        - session.read
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            example:
              model:
                name: claude-sonnet-4-5
                effort: high
              policy:
                mode: progressive
      responses:
        "200":
          description: OK
          content:
            application/json:
              example:
                schema: 1
                id: ses_01M34G2JF01B91B8399CD1G6YP
                agent:
                  id: agent_01M34FSDG0Q60424XT3D96DRAJ
                  name: release-notes
                  version: 3
                  digest: sha256:dac7fd51151199dc6af109f5da3680a4e7485daf2bc6191a047261ae75933aa9
                  bundle: sha256:b5790eaab58e675da4a3732b7a53afea7b61c87bc3810b06772c64fae9f986ec
                title: Notes for v1.4.0
                initiator:
                  subject: https://login.example|alice
                  kind: person
                runner: hosted
                status: idle
                stop_reason: end_turn
                turn: 1
                last_seq: 7
                machine:
                  kind: cella
                  image: base
                policy:
                  mode: progressive
                  thresholds:
                    flag_at: 0.3
                    ask_at: 0.5
                    block_at: 0.9
                budget:
                  spent_cost_usd_micro: 1200
                model:
                  name: claude-sonnet-4-5
                  effort: high
                limits:
                  turn_timeout: 2h0m0s
                  max_age: 168h0m0s
                capture: {}
                attended: true
                created_at: "2026-09-22T12:05:00Z"
                updated_at: "2026-09-22T12:10:00Z"
                expires_at: "2026-09-29T12:05:00Z"
        default:
          $ref: "#/components/responses/Error"
    delete:
