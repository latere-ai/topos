# Every push to main and every pull request runs the gate, the shared
# pipeline of latere-ai/ci, and the checks that need the tree and no
# cluster: a tidy module file and an image that builds. Every third-party
# action is pinned by commit.
name: verify
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read

# A newer push to the same ref supersedes this run: its commit carries every
# change this one would verify, and the runner is better spent on it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  # Every job runs on GitHub's hosted runners. The repository is public,
  # so they cost nothing, and a hosted runner is a fresh machine per job.
  gate:
    if: "!startsWith(github.ref, 'refs/tags/')"
    uses: latere-ai/ci/.github/workflows/lateregate.yml@v1
    with:
      runs_on: ubuntu-latest
      test_os: '["ubuntu-latest"]'

  tidy:
    name: go.mod and go.sum are tidy
    if: "!startsWith(github.ref, 'refs/tags/')"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # Spec 001's dependency rule names the module's direct dependencies;
      # go.mod is where a reader checks the claim, so it has to agree with
      # the imports.
      - run: go mod tidy -diff

  # The postgres tier: the store's tests against a real Postgres, which
  # the hermetic suite has none of. The harness reads DATABASE_URL and
  # creates a database per test on it.
  postgres:
    name: the postgres tier
    if: "!startsWith(github.ref, 'refs/tags/')"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: topos
          POSTGRES_DB: topos
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 2s --health-timeout 5s --health-retries 30
    env:
      DATABASE_URL: postgres://postgres:topos@localhost:5432/topos?sslmode=disable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go test -race -tags postgres ./internal/store/postgres/...

  # A device session end to end (spec 080): toposd, a real Cella control
  # plane and a worker on Cella's local driver, which confines the
  # computer's processes with srt over bubblewrap. cellad is the one of
  # the Cella this module pins. Ubuntu's AppArmor blocks the unprivileged
  # user namespaces bubblewrap needs until they are allowed.
  device:
    name: a device session end to end
    if: "!startsWith(github.ref, 'refs/tags/')"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: The sandbox runtime and what it uses
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap socat ripgrep
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          npm install -g @anthropic-ai/sandbox-runtime
          srt echo ok
      - name: cellad of the pinned Cella
        run: go install "latere.ai/x/cella/cmd/cellad@$(go list -m -f '{{.Version}}' latere.ai/x/cella)"
      - name: The device session
        run: CELLAD="$(go env GOPATH)/bin/cellad" go test -count=1 -v -run '^TestADeviceSessionEndToEnd$' ./cmd/toposd/

  image:
    name: the developer image builds
    if: "!startsWith(github.ref, 'refs/tags/')"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker build -t toposd:candidate .
      - name: The image reports its version
        run: |
          docker run --rm toposd:candidate -version | grep -q '^toposd '
