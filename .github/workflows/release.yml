# The release pipeline of spec 028, on a v* tag, through latere-ai/ci's
# shared image release stages. The build stage requires that the tag's
# commit passed verify and checks the tag and its CHANGELOG section. It then
# compiles toposd for linux/amd64 and linux/arm64 and the topos-machine
# helper for every platform a machine may run on, once, from the tag; builds
# the image topos from them with Dockerfile.ci, pushes it by digest and
# under no tag, checks the candidate reports the version the tag pins, signs
# it, and gives it a bill of materials and SBOM and provenance attestations.
# The deploy stage then rolls Latere's own installation, only where the
# repository variable TOPOS_RELEASE_DEPLOY is set: deploy/prod applied with
# the image pinned by digest, the Deployment waited for, and
# tools/smoke/release.sh repeated against the live origin. Only then does the
# publish stage tag the digest, sign checksums.txt over
# the binaries and the bill of materials, and publish the GitHub release
# with the CHANGELOG section as its body and those files attached. The
# verify stage then checks the published release from a runner with no
# checkout, as someone installing it would.
#
# The image namespace is the repository owner's, so a fork's tag publishes
# under the fork's. Each job is granted only what its stage needs.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    uses: latere-ai/ci/.github/workflows/image-build.yml@v1
    permissions:
      contents: read
      actions: read
      packages: write
      id-token: write
      attestations: write
    with:
      # The image is topos and the binary it runs is toposd, which prints
      # "toposd <tag> (<commit>, <date>)" for -version.
      image_1: '{"name": "topos", "dockerfile": "Dockerfile.ci", "version_args": "-version", "version_expect": "toposd {tag} ("}'
      # The binaries Dockerfile.ci copies, with the build identity the
      # version flag reports, and the helper a machine receives for each
      # platform it may run on (spec 009): a sandbox's, and a person's own
      # computer's, which may be a Mac (spec 080). They land in dist/, so
      # the release attaches the same files the image carries.
      archives_command: |
        pkg=$(go list -m)/internal/version
        ldflags="-X ${pkg}.Version=${TAG} -X ${pkg}.Commit=$(git rev-parse --short HEAD) -X ${pkg}.Date=$(TZ=UTC git log -1 --format=%cd --date=format-local:%Y-%m-%dT%H:%M:%SZ)"
        for arch in amd64 arm64; do
          CGO_ENABLED=0 GOOS=linux GOARCH=$arch go build -trimpath -ldflags "$ldflags" -o "dist/toposd_linux_${arch}" ./cmd/toposd
        done
        for platform in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
          os=${platform%/*} arch=${platform#*/}
          CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath -o "dist/topos-machine-${os}-${arch}" ./cmd/topos-machine
        done
      runs_on: ubuntu-latest

  # Between the build and the publish stage: the shared deploy stage, under
  # the production environment, so the rollout is a GitHub deployment with a
  # URL on the repository's Deployments page. The repository variable and the
  # kubeconfig secret are set on this repository and on no fork, so a tag on
  # a fork publishes every artifact and skips this job. The image is given by
  # digest, as the overlay's own name for it, because it carries no tag until
  # publish. deploy/prod holds only re-appliable manifests;
  # deploy/prod-bootstrap is never read. The rollout may wait for the cluster
  # to add a node for the new Pod, so it is allowed the Deployment's own
  # progress deadline.
  deploy:
    name: deploy and smoke
    # build is named for its outputs: a job reads the outputs of the jobs it
    # needs directly, and of no other.
    needs: [build]
    if: ${{ vars.TOPOS_RELEASE_DEPLOY != '' }}
    uses: latere-ai/ci/.github/workflows/image-deploy.yml@v1
    permissions:
      contents: read
    with:
      images: toposd=${{ needs.build.outputs.ref_1 }}@${{ needs.build.outputs.digest_1 }}
      deployments: |
        toposd
      url: https://api.latere.ai/v1/agents
      rollout_timeout: 15m
    secrets:
      DEPLOY_KUBECONFIG: ${{ secrets.TOPOS_KUBECONFIG }}

  publish:
    needs: [build, deploy]
    # deploy is skipped on every repository that sets no TOPOS_RELEASE_DEPLOY,
    # and a job that leans on the implicit success() is skipped whenever a
    # job above it in the graph is, so each result is named here.
    if: ${{ always() && needs.build.result == 'success' && needs.deploy.result != 'failure' && needs.deploy.result != 'cancelled' }}
    uses: latere-ai/ci/.github/workflows/image-publish.yml@v1
    permissions:
      contents: write
      packages: write
      id-token: write
    with:
      images: ${{ needs.build.outputs.images }}
      # The smoke evidence is the run artifact the deploy stage uploads. A
      # release whose deploy was skipped has none, and the publish stage
      # refuses an evidence pattern that names no file, so it is named only
      # when the deploy ran.
      evidence: ${{ needs.deploy.result == 'success' && 'smoke-evidence' || '' }}
      runs_on: ubuntu-latest

  verify:
    needs: publish
    # deploy sits above this job in the graph and is skipped on a fork, so
    # the result this job waits on is named, as on publish.
    if: ${{ always() && needs.publish.result == 'success' }}
    uses: latere-ai/ci/.github/workflows/release-verify.yml@v1
    permissions:
      contents: read
      packages: read
      attestations: read
    with:
      images: topos
      runs_on: ubuntu-latest
