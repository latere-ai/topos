# The release pipeline of spec 028, on a v* tag: the tag's commit must
# have passed verify; toposd and the topos-machine helper builds are
# compiled once from the tag, and the image `topos` is built from them,
# pushed by digest and under no tag, signed, and given a bill of materials
# and a provenance attestation; the candidate must report the version the
# tag pins; only then is the digest tagged, and the GitHub release is
# created with the CHANGELOG section as its body by the family's shared
# notes pipeline.
#
# Nothing here pushes to the default branch, no job carries a permission
# another needs, and the image namespace is the repository owner's, so a
# fork's tag publishes under the fork's. Every third-party action is pinned
# by commit with its version in a comment.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE: topos

jobs:
  # 1. The verify run for the push of this very commit concluded success.
  # `lateregate release` pushes the branch and the tag in one push, so the
  # run exists by now and may still be running; a tag on a commit whose
  # gate never ran, or ran red, fails here and publishes nothing. The run
  # the tag's own push starts skips every job, so it is not the one read.
  gate-green:
    name: the tag's commit passed verify
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
    steps:
      - name: Wait for the verify run on this commit and require success
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in $(seq 1 110); do
            # $ENV is jq's, which reads the tag from the environment.
            # shellcheck disable=SC2016
            conclusions=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/verify.yml/runs?head_sha=${GITHUB_SHA}&event=push&per_page=20" \
              --jq '[.workflow_runs[] | select(.head_branch != $ENV.GITHUB_REF_NAME) | .conclusion // "running"] | join(" ")')
            case " $conclusions " in
              *" success "*) echo "verify concluded success on ${GITHUB_SHA}"; exit 0 ;;
              *" failure "*|*" cancelled "*|*" timed_out "*|*" startup_failure "*|*" action_required "*)
                echo "verify concluded '$conclusions' on ${GITHUB_SHA}; a release is cut from a green tree" >&2; exit 1 ;;
            esac
            if [ -z "$conclusions" ] && [ "$i" -gt 10 ]; then
              echo "no verify run exists for the push of ${GITHUB_SHA}; tag a commit whose gate ran" >&2; exit 1
            fi
            sleep 30
          done
          echo "verify did not conclude on ${GITHUB_SHA} within the hour" >&2; exit 1

  # 2. The binaries, compiled once from this checkout with the tag's build
  # identity, and the image built from them. The image is pushed by digest
  # and under no tag, so a run that stops before the digest is tagged
  # leaves one unreferenced digest and nothing an operator could pull by
  # accident.
  build:
    name: the binaries and the image by digest
    needs: gate-green
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      owner: ${{ steps.owner.outputs.owner }}
      digest: ${{ steps.image.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # The namespace is the account that pushed the tag, lowered, read
      # here and written nowhere in the tree. A repository variable
      # overrides it, for an installation that publishes elsewhere.
      - name: The image namespace is the repository owner's
        id: owner
        env:
          OVERRIDE: ${{ vars.RELEASE_IMAGE_NAMESPACE }}
        run: |
          owner=${OVERRIDE:-$GITHUB_REPOSITORY_OWNER}
          echo "owner=$(printf '%s' "$owner" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
      - name: The tag has a CHANGELOG section
        run: go tool lateregate release-notes "${GITHUB_REF_NAME}" > /dev/null
      # An image tag cannot carry SemVer build metadata, and the deploy
      # overlays name the image by the git tag.
      - name: The tag is a valid image tag
        run: |
          case "${GITHUB_REF_NAME}" in
            *+*) echo "${GITHUB_REF_NAME} carries build metadata, which an image tag cannot; cut a tag without it" >&2; exit 1 ;;
          esac
      # toposd for each architecture of the image index, and the helper a
      # sandbox receives for each architecture a sandbox may run on (spec
      # 009), with the build identity the version flag reports.
      - name: Build the binaries
        run: |
          pkg=$(go list -m)/internal/version
          ldflags="-X ${pkg}.Version=${GITHUB_REF_NAME} -X ${pkg}.Commit=$(git rev-parse --short HEAD) -X ${pkg}.Date=$(git log -1 --format=%cd --date=format-local:%Y-%m-%dT%H:%M:%SZ)"
          mkdir -p dist/helpers
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH=$arch go build -trimpath -ldflags "$ldflags" -o "dist/toposd_linux_${arch}" ./cmd/toposd
            CGO_ENABLED=0 GOOS=linux GOARCH=$arch go build -trimpath -o "dist/helpers/topos-machine-linux-${arch}" ./cmd/topos-machine
          done
          (cd dist && sha256sum toposd_linux_* helpers/* | tee checksums.txt)
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Build and push the image by digest, under no tag
        id: image
        env:
          OWNER: ${{ steps.owner.outputs.owner }}
        run: |
          mkdir -p out
          docker buildx build --platform linux/amd64,linux/arm64 -f Dockerfile.ci \
            --output "type=image,name=${REGISTRY}/${OWNER}/${IMAGE},push-by-digest=true,name-canonical=true,push=true" \
            --metadata-file out/image.json .
          digest=$(jq -r '."containerimage.digest"' out/image.json)
          echo "the candidate is ${REGISTRY}/${OWNER}/${IMAGE}@${digest}"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
      # The candidate reports the build identity this tag pins, so the
      # binary inside is the one compiled above.
      - name: The image reports the version this tag pins
        env:
          OWNER: ${{ steps.owner.outputs.owner }}
        run: |
          got=$(docker run --rm "${REGISTRY}/${OWNER}/${IMAGE}@${{ steps.image.outputs.digest }}" -version)
          echo "$got"
          case "$got" in
            "toposd ${GITHUB_REF_NAME} ("*) ;;
            *) echo "the image reports '$got' and the tag is ${GITHUB_REF_NAME}" >&2; exit 1 ;;
          esac
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign the image by digest with the workflow's identity
        env:
          OWNER: ${{ steps.owner.outputs.owner }}
        run: cosign sign --yes "${REGISTRY}/${OWNER}/${IMAGE}@${{ steps.image.outputs.digest }}"
      - name: The bill of materials of the image
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: ${{ env.REGISTRY }}/${{ steps.owner.outputs.owner }}/${{ env.IMAGE }}@${{ steps.image.outputs.digest }}
          format: spdx-json
          output-file: dist/sbom-topos.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Attest the image's bill of materials
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-name: ${{ env.REGISTRY }}/${{ steps.owner.outputs.owner }}/${{ env.IMAGE }}
          subject-digest: ${{ steps.image.outputs.digest }}
          sbom-path: dist/sbom-topos.spdx.json
          push-to-registry: true
      - name: Attest the image's provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ steps.owner.outputs.owner }}/${{ env.IMAGE }}
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true

  # 3. Only now does the digest get the :<tag> reference.
  publish:
    name: tag the digest
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    env:
      OWNER: ${{ needs.build.outputs.owner }}
    steps:
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Tag the digest
        run: |
          docker buildx imagetools create -t "${REGISTRY}/${OWNER}/${IMAGE}:${GITHUB_REF_NAME}" \
            "${REGISTRY}/${OWNER}/${IMAGE}@${{ needs.build.outputs.digest }}"
          echo "published ${REGISTRY}/${OWNER}/${IMAGE}:${GITHUB_REF_NAME} at ${{ needs.build.outputs.digest }}"

  # 4. The GitHub release, with the CHANGELOG section for the tag as its
  # body, created by the family's shared notes pipeline once the image it
  # announces is tagged.
  release:
    needs: publish
    permissions:
      contents: write
    uses: latere-ai/ci/.github/workflows/notes-release.yml@v1
    secrets: inherit
