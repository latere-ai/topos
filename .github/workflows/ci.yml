name: ci

# Every Go gate this repository has runs through latere-ai/ci's reusable
# pipeline, which probes the Makefile and runs the targets it finds. The
# checks live in latere.ai/x/ci-gate, pinned in go.mod, so each of them runs
# identically from a laptop: `make test`, `make cover`, `make spec-lint` and
# the rest need nothing but this checkout.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    uses: latere-ai/ci/.github/workflows/lateregate.yml@v1
