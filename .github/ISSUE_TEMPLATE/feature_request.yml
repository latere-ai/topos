name: Feature request
description: Propose a focused improvement to the Topos Go package
title: "proposal: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What package user problem should Topos solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed API or behavior
      description: Show the caller experience when an API change is involved.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Describe current workarounds and their limitations.
  - type: textarea
    id: compatibility
    attributes:
      label: Compatibility impact
      description: Note any migration, dependency, or runtime behavior concerns.
