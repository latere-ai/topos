#
# The smallest installation: the base in the namespace of
# deploy/bootstrap, with the image an operator builds or pulls.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: topos
resources:
  - ../../base
images:
  - name: toposd
    newName: ghcr.io/example/toposd
    newTag: dev
# The address clients reach the server at and the identity provider whose
# tokens it accepts. A self-hoster without one leaves TOPOS_OIDC_ISSUERS
# out and puts a TOPOS_LOCAL_ISSUER_KEY in a toposd Secret instead.
configMapGenerator:
  - name: toposd
    literals:
      - TOPOS_PUBLIC_URL=https://topos.example.com
      - TOPOS_OIDC_ISSUERS=https://login.example.com
