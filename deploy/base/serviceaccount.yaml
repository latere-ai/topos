#
# The server's account. It calls no Kubernetes API, so no Role is bound
# and no token is mounted.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: toposd
  labels:
    app.kubernetes.io/name: toposd
    app.kubernetes.io/component: server
automountServiceAccountToken: false
