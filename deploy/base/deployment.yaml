#
# The server: the API, the store and the queue (specs 014 to 016). Its
# replicas hold no session state of their own: a session's log is the
# store's and its lease the queue's, so replicas are interchangeable.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: toposd
  labels:
    app.kubernetes.io/name: toposd
    app.kubernetes.io/component: server
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: toposd
  template:
    metadata:
      labels:
        app.kubernetes.io/name: toposd
        app.kubernetes.io/component: server
    spec:
      serviceAccountName: toposd
      automountServiceAccountToken: false
      # Spec 002's shutdown: readiness answers 503 at once, a 3 second
      # drain delay, then 60 seconds of grace for the open streams.
      terminationGracePeriodSeconds: 90
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: toposd
          # The placeholder the overlay or the release pipeline points at
          # the published image with an `images` entry.
          image: toposd
          args: ["serve"]
          # The installation's own variables: TOPOS_PUBLIC_URL and
          # TOPOS_OIDC_ISSUERS from the overlay's toposd ConfigMap, and
          # the local issuer's TOPOS_LOCAL_ISSUER_KEY, when there is one,
          # from a toposd Secret. toposd does not start without the URL
          # and one of the other two (spec 006).
          envFrom:
            - configMapRef:
                name: toposd
            - secretRef:
                name: toposd
                optional: true
          env:
            # The audience this server answers to. Every token it accepts
            # carries it. An installation whose callers hold tokens
            # addressed to a second name lists both, the core's own first.
            - name: TOPOS_OIDC_AUDIENCE
              value: "topos"
            - name: TOPOS_PUBLIC_ADDR
              value: ":8080"
            - name: TOPOS_INTERNAL_ADDR
              value: ":8081"
          ports:
            - name: public
              containerPort: 8080
            - name: internal
              containerPort: 8081
          readinessProbe:
            httpGet:
              path: /readyz
              port: internal
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /livez
              port: internal
            initialDelaySeconds: 10
            periodSeconds: 30
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
