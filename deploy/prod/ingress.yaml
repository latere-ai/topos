#
# The core's one rule at the platform origin: /v1/agents on api.latere.ai,
# beside /v1/models and /v1/environments, forwarded without a rewrite,
# because the core serves its API under TOPOS_BASE_PATH (topos spec 030).
# There is no tls block and no issuer annotation: the host's certificate is
# the origin's, which arcad's Ingress holds for every rule on api.latere.ai.
#
# A session's event stream is Server-Sent Events, open for as long as a
# client follows it, so the read and send timeouts are an hour and the
# response is not buffered, which would hold the stream's events until it
# ended; the core writes a heartbeat every 15 seconds. The body limit is the
# core's largest, the 8 MiB of one sent event.
#
# The console does not come through here: platformd reaches the core in the
# cluster, at the Service, under the same path.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: toposd
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: 8m
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
spec:
  ingressClassName: nginx
  rules:
    - host: api.latere.ai
      http:
        paths:
          - path: /v1/agents
            pathType: Prefix
            backend:
              service:
                name: toposd
                port:
                  name: public
