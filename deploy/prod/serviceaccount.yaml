#
# The core's image is pulled with ghcr-secret, the docker-registry Secret
# every latere-ai image in this namespace pulls with, so the Pods pull
# whether the package is public or private.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: toposd
imagePullSecrets:
  - name: ghcr-secret
