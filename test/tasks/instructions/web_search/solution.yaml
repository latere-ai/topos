steps:
  - tool_calls:
      - name: web_search
        input: {query: shopctl latest release}
  - expect: {tool_result_contains: "${SERVE_URL}/shopctl/releases.html"}
    tool_calls:
      - name: web_fetch
        input: {url: "${SERVE_URL}/shopctl/releases.html"}
  - expect: {tool_result_contains: "4.3.0, released"}
    tool_calls:
      - name: write
        input: {path: version.txt, content: "4.3.0\n"}
  - text: The latest release of shopctl is 4.3.0.
