steps:
  - tool_calls:
      - name: read
        input: {path: stats.go}
      - name: read
        input: {path: stats_test.go}
  - tool_calls:
      - name: edit
        input:
          path: stats.go
          old_string: |
            import "errors"
          new_string: |
            import (
            	"errors"
            	"slices"
            )
  - tool_calls:
      - name: edit
        input:
          path: stats.go
          old_string: |
            return sum / float64(len(xs)), nil
            }
          new_string: |
            return sum / float64(len(xs)), nil
            }

            // Median returns the middle value of xs, or the mean of the two
            // middle values when xs has an even length. xs is not reordered.
            func Median(xs []float64) (float64, error) {
            	if len(xs) == 0 {
            		return 0, ErrEmpty
            	}
            	s := slices.Sorted(slices.Values(xs))
            	m := len(s) / 2
            	if len(s)%2 == 1 {
            		return s[m], nil
            	}
            	return (s[m-1] + s[m]) / 2, nil
            }
  - tool_calls:
      - name: edit
        input:
          path: stats_test.go
          old_string: |
            t.Errorf("Mean(nil) = %v, want ErrEmpty", err)
            	}
            }
          new_string: |
            t.Errorf("Mean(nil) = %v, want ErrEmpty", err)
            	}
            }

            func TestMedian(t *testing.T) {
            	for _, c := range []struct {
            		xs   []float64
            		want float64
            	}{
            		{[]float64{5}, 5},
            		{[]float64{3, 1, 2}, 2},
            		{[]float64{4, 1, 3, 2}, 2.5},
            	} {
            		got, err := Median(c.xs)
            		if err != nil || got != c.want {
            			t.Errorf("Median(%v) = %v, %v; want %v", c.xs, got, err, c.want)
            		}
            	}
            	if _, err := Median(nil); !errors.Is(err, ErrEmpty) {
            		t.Errorf("Median(nil) = %v, want ErrEmpty", err)
            	}
            }
  - tool_calls:
      - name: bash
        input: {command: gofmt -l . && go vet ./... && go test ./...}
  - expect: {tool_result_contains: ok}
    text: Median is in stats.go with a table test, and the tests pass.
