            // Median returns the middle value of xs.
            func Median(xs []float64) (float64, error) {
            	if len(xs) == 0 {
            		return 0, ErrEmpty
            	}
            	sort.Float64s(xs)
            	m := len(xs) / 2
            	if len(xs)%2 == 1 {
            		return xs[m], nil
            	}
            	return (xs[m-1] + xs[m]) / 2, nil
            }
