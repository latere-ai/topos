\* expect violation: Exclusive
\* One failed renewal more than the lease survives: it lapses, a second
\* replica takes it, and the first, which keeps working, works beside it.
CONSTANTS
  Replicas = {r1, r2}
  Horizon = 70
  MaxFail <- OverlongFails
SPECIFICATION Spec
INVARIANT TypeOK
INVARIANT Exclusive
